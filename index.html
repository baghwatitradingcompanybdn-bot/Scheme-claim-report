<body>

<main>

<h1>Scheme Claim Report</h1>

<div class="sub">
Automatic monthly scheme calculator
</div>

<div class="card">

<label>
Purchase Excel — previous 2 complete months
</label>

<input
 id="excel"
 type="file"
 accept=".xlsx,.xls,.csv"
>

Current month scheme chart
</label>

 id="chart"

>

Generate Report
</button>

Ready.
</div>

<script>

const $=id=>document.getElementById(id);


/* SCREEN CURRENCY */

const screenMoney=n=>
 "₹"+(Number(n)||0).toLocaleString("en-IN",{
  minimumFractionDigits:2,
  maximumFractionDigits:2
 });


/*
 PDF CURRENCY

 jsPDF Helvetica does not reliably support ₹.
 Therefore PDF deliberately uses Rs.
 This removes the unwanted "1" problem.
*/

const pdfMoney=n=>
 "Rs. "+(Number(n)||0).toLocaleString("en-IN",{
  minimumFractionDigits:2,
  maximumFractionDigits:2
 });


/* NUMBER */

const num=v=>{

 let s=String(v??"")
  .replace(/[₹,\s]/g,"");

 let n=parseFloat(s);

 return Number.isFinite(n)?n:0;
};


/* CLEAN TEXT */

const clean=s=>
 String(s??"")
 .toLowerCase()
 .replace(/₹/g," rs ")
 .replace(/[^a-z0-9.%\-]/g," ")
 .replace(/\s+/g," ")
 .trim();


/* MONTH */

function monthKey(d){

 return d.getFullYear()
  +"-
  "+String(d.getMonth()+1).padStart(2,"0");

}


/* DATE */

function dateValue(v){

 if(v instanceof Date && !isNaN(v))
  return v;

 if(typeof v==="number"){

  return new Date(
   Date.UTC(1899,11,30)+
   v*86400000
  );

 }

 let s=String(v??"").trim();

 if(!s)
  return null;

 let d=new Date(s);

 if(!isNaN(d))
  return d;

 let m=s.match(
  /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/
 );

 if(m){

  d=new Date(
   +m[3],
   +m[2]-1,
   +m[1]
  );

  return isNaN(d)?null:d;
 }

 return null;
}


/* =========================
   EXCEL READING
   ========================= */

async function readExcel(file){

 const wb=XLSX.read(
  await file.arrayBuffer(),
  {
   type:"array",
   cellDates:true
  }
 );

 const ws=
  wb.Sheets[wb.SheetNames[0]];

 const rows=
  XLSX.utils.sheet_to_json(
   ws,
   {
    header:1,
    defval:""
   }
  );

 let header=-1;

 for(let i=0;i<rows.length;i++){

  if(
   rows[i].some(
    v=>clean(v).includes("gross amount")
   )
  ){
   header=i;
   break;
  }

 }

 if(header<0)
  throw Error(
   "Gross Amount column not found."
  );

 const heads=
  rows[header].map(v=>clean(v));

 const di=heads.findIndex(
  v=>v==="grn date"||
  v.includes("grn date")
 );

 const ni=heads.findIndex(
  v=>v==="product name"||
  v.includes("product name")
 );

 const gi=heads.findIndex(
  v=>v==="gross amount"||
  v.includes("gross amount")
 );

 if(di<0||ni<0||gi<0){

  throw Error(
   "GRN Date, Product Name or Gross Amount column is missing."
  );

 }

 const out=[];

 for(
  const r of rows.slice(header+1)
 ){

  const date=dateValue(r[di]);

  const name=
   String(r[ni]??"").trim();

  if(!date||!name)
   continue;

  out.push({
   date:date,
   name:name,
   gross:num(r[gi])
  });

 }

 if(out.length<1)
  throw Error(
   "No purchase rows found."
  );

 return out;
}


/* =========================
   OCR CURRENT SCHEME CHART
   ========================= */

async function ocrChart(file){

 $("status").textContent=
  "Reading current scheme chart…";

 const url=
  URL.createObjectURL(file);

 const result=
  await Tesseract.recognize(
   url,
   "eng",
   {
    logger:m=>{

     if(
      m.status===
      "recognizing text"
     ){

      $("status").textContent=
       "Reading scheme chart… "+
       Math.round(
        (m.progress||0)*100
       )+"%";

     }

    }
   }
  );

 URL.revokeObjectURL(url);

 const text=
  result.data.text||"";

 if(!text.trim()){

  throw Error(
   "Could not read the scheme chart. Please use a clear chart image."
  );

 }

 return text;
}


/* OCR LINES */

function ocrLines(text){

 return text
  .split(/\r?\n/)
  .map(
   x=>x
    .replace(/\s+/g," ")
    .trim()
  )
  .filter(Boolean);

}


/* =========================
   SCHEME CHART PARSER
   ========================= */

function parseSchemeChart(text){

 const lines=
  ocrLines(text);

 const schemes=[];

 const ignore=
  /^(scheme|product|products|mrp|rate|rates|liability|slab|slabs|from|to|upto|up to|total|month)$/i;


 for(
  let i=0;
  i<lines.length;
  i++
 ){

  let raw=lines[i];

  let line=clean(raw);

  if(!line||ignore.test(raw))
   continue;


  const pct=[
   ...raw.matchAll(
    /(\d+(?:\.\d+)?)\s*%/g
   )
  ]
  .map(m=>Number(m[1]))
  .filter(
   x=>x>=0&&x<=100
  );


  if(!pct.length)
   continue;


  /*
   Find product/head name
   near the percentage row.
  */

  let title="";

  for(
   let j=i;
   j>=Math.max(0,i-3);
   j--
  ){

   let candidate=
    lines[j]
    .replace(
     /(\d+(?:\.\d+)?)\s*%/g,
     " "
    )
    .replace(
     /\b\d{1,5}(?:\.\d+)?\s*(?:rs|₹)?\b/gi,
     " "
    )
    .replace(
     /\s+/g,
     " "
    )
    .trim();

   if(
    candidate.length>=3 &&
    !/^\d[\d\s.\-–—]*$/.test(candidate)
   ){

    title=candidate;
    break;

   }

  }


  if(!title)
   continue;


  /*
   Explicit MRP.
  */

  let mrp=null;

  const mr=
   raw.match(
    /(?:mrp|₹|rs\.?)\s*[-:]?\s*(\d+(?:\.\d+)?)/i
   );

  if(mr)
   mrp=Number(mr[1]);


  /*
   Rates.
  */

  const rates=
   pct.map(p=>({
    min:null,
    max:null,
    rate:p/100
   }));


  /*
   Slab ranges.
  */

  const nearby=
   lines
    .slice(
     Math.max(0,i-3),
     Math.min(lines.length,i+2)
    )
    .join(" ");


  const ranges=[];

  const rangeRe=
   /(\d+(?:\.\d+)?)\s*(?:-|–|—|to)\s*(\d+(?:\.\d+)?)/gi;

  let rm;

  while(
   (rm=rangeRe.exec(nearby))
  ){

   ranges.push([
    Number(rm[1]),
    Number(rm[2])
   ]);

  }


  const plus=[
   ...nearby.matchAll(
    /(\d+(?:\.\d+)?)\s*\+/g
   )
  ]
  .map(
   m=>Number(m[1])
  );


  for(
   let k=0;
   k<Math.min(
    ranges.length,
    rates.length
   );
   k++
  ){

   rates[k].min=
    ranges[k][0];

   rates[k].max=
    ranges[k][1];

  }


  for(
   let k=0;
   k<Math.min(
    plus.length,
    rates.length
   );
   k++
  ){

   if(rates[k].min===null)
    rates[k].min=plus[k];

   rates[k].max=Infinity;

  }


  schemes.push({
   title:title,
   mrp:mrp,
   rates:rates,
   sourceLine:raw
  });

 }


 /*
  Merge duplicate OCR detections.
 */

 const merged=[];

 for(const s of schemes){

  let old=
   merged.find(
    x=>
     clean(x.title)===
     clean(s.title)&&
     x.mrp===s.mrp
   );

  if(!old){

   merged.push(s);

  }else{

   old.rates.push(
    ...s.rates
   );

  }

 }


 return merged.filter(
  s=>{
   const t=clean(s.title);

   return(
    t.length>=3 &&
    /[a-z]/.test(t)
   );

  }
 );

}
