<body>

<div class="wrap">

<script>
"use strict";

/* =========================================================
   GLOBALS
========================================================= */

let purchaseRows=[];
let schemeRows=[];
let finalCalc=null;

const purchaseInput=document.getElementById("purchaseFile");
const schemeInput=document.getElementById("schemeFile");
const calculateBtn=document.getElementById("calculate");
const pdfBtn=document.getElementById("pdf");
const statusEl=document.getElementById("status");
const resultEl=document.getElementById("result");


/* =========================================================
   HELPERS
========================================================= */

function money(n){
  return "₹ " + Number(n||0).toLocaleString("en-IN",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });
}

function pdfMoney(n){
  return "Rs. " + Number(n||0).toLocaleString("en-IN",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });
}

function clean(s){
  return String(s||"")
    .toLowerCase()
    .replace(/₹/g," rs ")
    .replace(/rs\./g," rs ")
    .replace(/[^a-z0-9.%₹\- ]/g," ")
    .replace(/\s+/g," ")
    .trim();
}

function monthKey(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}

function parseDate(v){

  if(v instanceof Date && !isNaN(v))
    return new Date(v);

  if(typeof v==="number"){

    const d=XLSX.SSF.parse_date_code(v);

    if(d)
      return new Date(d.y,d.m-1,d.d);
  }

  const s=String(v||"").trim();

  if(!s) return null;

  let d=new Date(s);

  if(!isNaN(d))
    return d;

  const m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);

  if(m)
    return new Date(+m[3],+m[2]-1,+m[1]);

  return null;
}

function amount(v){

  if(typeof v==="number")
    return isFinite(v)?v:0;

  const s=String(v||"")
    .replace(/,/g,"")
    .replace(/₹/g,"")
    .replace(/Rs\.?/gi,"")
    .trim();

  const n=parseFloat(s);

  return isFinite(n)?n:0;
}

function escapeHtml(s){

  return String(s||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}


/* =========================================================
   PURCHASE EXCEL
========================================================= */

async function readPurchaseExcel(file){

  const buffer=await file.arrayBuffer();

  const wb=XLSX.read(buffer,{
    type:"array",
    cellDates:true
  });

  let ws=null;

  for(const name of wb.SheetNames){

    const candidate=wb.Sheets[name];

    const data=XLSX.utils.sheet_to_json(candidate,{
      defval:""
    });

    if(data.length){
      ws=candidate;
      break;
    }
  }

  if(!ws)
    throw new Error("No purchase data found in Excel.");

  const data=XLSX.utils.sheet_to_json(ws,{
    defval:""
  });

  if(!data.length)
    throw new Error("Purchase Excel is empty.");

  const keys=Object.keys(data[0]);

  const findKey=(name)=>{

    const wanted=clean(name);

    return keys.find(k=>clean(k)===wanted);
  };

  const dateKey=findKey("GRN Date");
  const nameKey=findKey("Product Name");
  const grossKey=findKey("Gross Amount");

  if(!dateKey || !nameKey || !grossKey){

    throw new Error(
      "Excel must contain GRN Date, Product Name and Gross Amount columns."
    );
  }

  return data.map(r=>({

    date:parseDate(r[dateKey]),

    product:String(r[nameKey]||"").trim(),

    gross:amount(r[grossKey])

  })).filter(r=>r.date && r.product);

}


/* =========================================================
   SCHEME CHART READER
========================================================= */

async function readSchemeFile(file){

  const name=file.name.toLowerCase();

  if(name.endsWith(".txt"))
    return await file.text();

  if(name.endsWith(".pdf"))
    return await readPDF(file);

  if(
    name.endsWith(".png") ||
    name.endsWith(".jpg") ||
    name.endsWith(".jpeg") ||
    name.endsWith(".webp")
  ){

    const result=await Tesseract.recognize(
      file,
      "eng",
      {
        logger:m=>{
          if(m.status==="recognizing text"){
            statusEl.textContent=
              "Reading scheme chart: "+
              Math.round((m.progress||0)*100)+"%";
          }
        }
      }
    );

    return result.data.text;
  }

  throw new Error(
    "Scheme chart must be PDF, image or TXT."
  );
}


/* =========================================================
   PDF OCR
========================================================= */

async function readPDF(file){

  const pdfjs=window.pdfjsLib;

  if(!pdfjs)
    throw new Error(
      "PDF reader is still loading. Please wait a few seconds and try again."
    );

  const buffer=await file.arrayBuffer();

  const pdf=await pdfjs.getDocument({
    data:buffer
  }).promise;

  let text="";

  for(let i=1;i<=pdf.numPages;i++){

    statusEl.textContent=
      "Reading scheme PDF page "+i+" of "+pdf.numPages+"...";

    const page=await pdf.getPage(i);

    const viewport=page.getViewport({
      scale:2
    });

    const canvas=document.createElement("canvas");

    canvas.width=viewport.width;
    canvas.height=viewport.height;

    const ctx=canvas.getContext("2d");

    await page.render({
      canvasContext:ctx,
      viewport
    }).promise;

    const result=await Tesseract.recognize(
      canvas,
      "eng",
      {
        logger:m=>{
          if(m.status==="recognizing text"){
            statusEl.textContent=
              "OCR page "+i+" : "+
              Math.round((m.progress||0)*100)+"%";
          }
        }
      }
    );

    text+="\n"+result.data.text;
  }

  return text;
}


/* =========================================================
   SCHEME PARSER
========================================================= */

function extractRates(text){

  const rates=[];

  const matches=
    text.match(/(\d+(?:\.\d+)?)\s*%/g)||[];

  matches.forEach(x=>{

    const n=parseFloat(x);

    if(n>0 && n<=100)
      rates.push(n);
  });

  return [...new Set(rates)].sort((a,b)=>a-b);
}


function extractMRPs(text){

  const result=[];

  const re1=
    /(?:mrp|m\.r\.p)\s*[-:]?\s*(?:rs\.?|₹)?\s*(\d+(?:\.\d+)?)/gi;

  let m;

  while((m=re1.exec(text))!==null)
    result.push(parseFloat(m[1]));


  const re2=
    /₹\s*(\d+(?:\.\d+)?)/g;

  while((m=re2.exec(text))!==null)
    result.push(parseFloat(m[1]));


  return [...new Set(result)];
}


function productWords(s){

  return clean(s)
    .replace(/\b\d+(?:\.\d+)?\s*(?:gm|g|kg|ml|ltr|l|pkt|pkts|bag|box|pcs|piece|strip)\b/g," ")
    .replace(/\b\d+\b/g," ")
    .split(" ")
    .filter(w=>w.length>=3);
}


function productMatch(purchase,scheme){

  const p=clean(purchase);
  const s=clean(scheme);

  if(!p || !s) return false;

  /* Special combined Confy head */

  if(
    s.includes("confy") &&
    (
      s.includes("pouch") ||
      s.includes("jar")
    )
  ){

    const isConfy=p.includes("confy");

    const isMelody=p.includes("melody");

    return isConfy && !isMelody;
  }


  const words=productWords(s)
    .filter(w=>![
      "regular",
      "classic",
      "extra",
      "mrp",
      "product",
      "scheme",
      "parle"
    ].includes(w));

  if(!words.length)
    return false;

  let score=0;

  words.forEach(w=>{
    if(p.includes(w))
      score++;
  });

  return score>=Math.max(
    1,
    Math.ceil(words.length*.55)
  );
}


function mrpMatches(purchase,schemeText){

  const mrps=extractMRPs(schemeText);

  if(!mrps.length)
    return true;

  const p=clean(purchase);

  const pmatches=[
    p.match(/mrp\s*[-:]?\s*(\d+(?:\.\d+)?)/i),
    p.match(/(?:^| )(\d+(?:\.\d+)?)(?: )*(?:gm|g|kg|ml|ltr|l)/i)
  ];

  let purchaseMrp=null;

  const m=p.match(
    /mrp\s*[-:]?\s*(\d+(?:\.\d+)?)/i
  );

  if(m)
    purchaseMrp=parseFloat(m[1]);

  if(purchaseMrp===null)
    return true;

  return mrps.some(x=>
    Math.abs(x-purchaseMrp)<0.01
  );
}


function parseSchemeRows(text){

  const lines=text
    .split(/\r?\n/)
    .map(x=>x.trim())
    .filter(Boolean);

  const rows=[];

  for(let i=0;i<lines.length;i++){

    const line=lines[i];

    const lower=clean(line);

    const rates=extractRates(line);

    const nextRates=
      i+1<lines.length
        ? extractRates(lines[i+1])
        : [];

    const allRates=[
      ...rates,
      ...nextRates
    ];

    if(!allRates.length)
      continue;


    let name=line;

    /*
      If current line is mostly just a slab/rate,
      look backwards for product name.
    */

    const alpha=(line.match(/[A-Za-z]{3,}/g)||[]).length;

    if(alpha<=1 && i>0)
      name=lines[i-1];


    const l=clean(name);

    const productHints=[
      "parle-g",
      "parle g",
      "gold",
      "magix",
      "dhinchak",
      "bourbon",
      "confy",
      "rusk",
      "atta",
      "20-20",
      "2020",
      "platina"
    ];

    const isProduct=
      productHints.some(x=>l.includes(x));


    if(!isProduct)
      continue;


    const mrps=extractMRPs(
      lines.slice(
        Math.max(0,i-1),
        Math.min(lines.length,i+2)
      ).join(" ")
    );


    rows.push({

      name:name,

      rates:[...new Set(allRates)].sort(
        (a,b)=>a-b
      ),

      mrps:mrps,

      raw:[
        lines[Math.max(0,i-1)],
        line,
        lines[Math.min(lines.length-1,i+1)]
      ].join(" ")

    });
  }


  /*
    Remove duplicate OCR rows.
  */

  const unique=[];

  rows.forEach(r=>{

    const found=unique.find(u=>
      clean(u.name)===clean(r.name)
    );

    if(!found)
      unique.push(r);
    else
      found.rates=[
        ...new Set([
          ...found.rates,
          ...r.rates
        ])
      ].sort((a,b)=>a-b);

  });


  /*
    Confy Pouch & Jar is one combined head.
  */

  const confyRates=unique
    .filter(r=>
      clean(r.name).includes("confy") &&
      (
        clean(r.name).includes("pouch") ||
        clean(r.name).includes("jar")
      )
    )
    .flatMap(r=>r.rates);


  if(confyRates.length){

    return [
      ...unique.filter(r=>
        !(
          clean(r.name).includes("confy") &&
          (
            clean(r.name).includes("pouch") ||
            clean(r.name).includes("jar")
          )
        )
      ),
      {
        name:"CONFY POUCH & JAR",
        rates:[Math.max(...confyRates)],
        mrps:[],
        combined:true
      }
    ];
  }

  return unique;
}


/* =========================================================
   CONFY SPECIAL MATCH
========================================================= */

function confyProduct(p){

  const x=clean(p);

  if(!x.includes("confy"))
    return false;

  /*
    Melody is excluded from Confy calculation.
  */

  if(x.includes("melody"))
    return false;

  /*
    Pouch:
    PB / PBG / ROL / ROLL

    Jar:
    JAR

    Funtoosh jars are also included.
  */

  return (
    x.includes("pb") ||
    x.includes("pbg") ||
    x.includes("rol") ||
    x.includes("roll") ||
    x.includes("jar") ||
    x.includes("funtoosh")
  );
}


/* =========================================================
   CURRENT SCHEME PRODUCT MATCH
========================================================= */

function getSchemeForPurchase(product){

  const p=clean(product);

  for(const s of schemeRows){

    if(s.combined && confyProduct(product))
      return s;

    if(
      !s.combined &&
      productMatch(product,s.name)
    ){

      /*
        If the scheme row has an explicit MRP,
        require exact MRP match.
      */

      if(s.mrps && s.mrps.length){

        const pm=
          p.match(
            /mrp\s*[-:]?\s*(\d+(?:\.\d+)?)/i
          );

        if(pm){

          const pmrp=parseFloat(pm[1]);

          const ok=s.mrps.some(x=>
            Math.abs(x-pmrp)<0.01
          );

          if(!ok)
            continue;
        }
      }

      return s;
    }
  }

  return null;
}


/* =========================================================
   LIABILITY
========================================================= */

function highestRate(row){

  if(!row || !row.rates || !row.rates.length)
    return 0;

  return Math.max(...row.rates);
}


/* =========================================================
   MONTH CALCULATION
========================================================= */

function calculateClaim(data){

  if(!data.length)
    throw new Error("No valid purchase rows found.");

  const months=[
    ...new Set(
      data
        .map(x=>monthKey(x.date))
        .sort()
    )
  ];

  if(months.length<2){

    throw new Error(
      "At least two complete purchase months are required."
    );
  }


  /*
    Use the latest two purchase months.
    The current scheme month itself is not included
    in purchase calculation.
  */

  const m2=months[months.length-1];
  const m1=months[months.length-2];


  const map={};


  data.forEach(r=>{

    const mk=monthKey(r.date);

    if(mk!==m1 && mk!==m2)
      return;


    const scheme=getSchemeForPurchase(r.product);

    if(!scheme)
      return;


    /*
      For normal products, group exact product.
      For Confy combined head, group everything together.
    */

    const key=
      scheme.combined
        ? "CONFY POUCH & JAR"
        : r.product;


    if(!map[key]){

      map[key]={
        product:
          scheme.combined
            ? "CONFY POUCH & JAR"
            : r.product,

        scheme:scheme,

        m1:0,
        m2:0
      };
    }


    if(mk===m1)
      map[key].m1+=r.gross;

    if(mk===m2)
      map[key].m2+=r.gross;
  });


  const rows=[];


  Object.values(map).forEach(x=>{

    const avg=(x.m1+x.m2)/2;

    const gate=avg*1.05;

    const rate=highestRate(x.scheme);

    /*
      Claim is based on gate achievement:
      if Month 2 purchase reaches gate,
      liability applies to gate amount.
      Otherwise claim is zero.
    */

    const achieved=x.m2>=gate;

    const claim=
      achieved
        ? gate*rate/100
        : 0;


    rows.push({

      product:x.product,

      m1:x.m1,

      m2:x.m2,

      avg:avg,

      gate:gate,

      rate:rate,

      claim:claim,

      achieved:achieved
    });
  });


  rows.sort((a,b)=>
    b.claim-a.claim
  );


  const totalClaim=
    rows.reduce(
      (sum,r)=>sum+r.claim,
      0
    );


  return {

    month1:m1,

    month2:m2,

    rows:rows,

    totalClaim:totalClaim
  };
}


/* =========================================================
   RENDER
========================================================= */

function render(calc){

  resultEl.classList.remove("hidden");

  document.getElementById("month1").textContent=
    calc.month1;

  document.getElementById("month2").textContent=
    calc.month2;

  document.getElementById("total").textContent=
    money(calc.totalClaim);

  document.getElementById("totalBottom").textContent=
    money(calc.totalClaim);


  const tbody=
    document.querySelector("#reportTable tbody");

  tbody.innerHTML="";


  calc.rows.forEach(r=>{

    const tr=document.createElement("tr");

    tr.innerHTML=`

      <td>${escapeHtml(r.product)}</td>

      <td class="num">${money(r.m1)}</td>

      <td class="num">${money(r.m2)}</td>

      <td class="num">${money(r.avg)}</td>

      <td class="num">${money(r.gate)}</td>

      <td class="rate">${r.rate.toFixed(2)}%</td>

      <td class="num"><b>${money(r.claim)}</b></td>

    `;

    tbody.appendChild(tr);
  });
}


/* =========================================================
   PDF
========================================================= */

function makePDF(calc){

  const jsPDF=window.jspdf.jsPDF;

  const pdf=new jsPDF({
    orientation:"landscape",
    unit:"mm",
    format:"a4"
  });

  const W=pdf.internal.pageSize.getWidth();
  const H=pdf.internal.pageSize.getHeight();

  const left=7;
  const top=27;

  const cols=[
    ["Product",76],
    ["Month 1",30],
    ["Month 2",30],
    ["Average",32],
    ["Gate",32],
    ["Liability %",27],
    ["Claim Amount",39]
  ];


  pdf.setFont("helvetica","bold");
  pdf.setFontSize(16);

  pdf.text(
    "MONTHLY SCHEME CLAIM REPORT",
    W/2,
    12,
    {align:"center"}
  );

  pdf.setFont("helvetica","normal");
  pdf.setFontSize(9);

  pdf.text(
    "Purchase Months: "+calc.month1+" and "+calc.month2,
    W/2,
    19,
    {align:"center"}
  );


  function header(y){

    let x=left;

    pdf.setFont("helvetica","bold");
    pdf.setFontSize(7.5);

    cols.forEach(c=>{

      pdf.rect(x,y,c[1],8);

      pdf.text(
        c[0],
        x+c[1]/2,
        y+5.2,
        {align:"center"}
      );

      x+=c[1];
    });
  }


  let y=top;

  header(y);

  y+=8;


  calc.rows.forEach(r=>{

    const product=safePdfText(r.product);

    const lines=pdf.splitTextToSize(
      product,
      cols[0][1]-3
    );

    const h=Math.max(
      8,
      lines.length*3.5+3
    );


    if(y+h>H-18){

      pdf.addPage();

      y=15;

      header(y);

      y+=8;
    }


    let x=left;

    pdf.setFont("helvetica","normal");
    pdf.setFontSize(7);

    pdf.rect(x,y,cols[0][1],h);

    pdf.text(
      lines,
      x+1.5,
      y+4.3
    );

    x+=cols[0][1];


    const vals=[
      pdfMoney(r.m1),
      pdfMoney(r.m2),
      pdfMoney(r.avg),
      pdfMoney(r.gate)
    ];


    for(let i=0;i<4;i++){

      pdf.rect(
        x,
        y,
        cols[i+1][1],
        h
      );

      pdf.text(
        vals[i],
        x+cols[i+1][1]-1.5,
        y+h/2+1.8,
        {align:"right"}
      );

      x+=cols[i+1][1];
    }


    pdf.rect(
      x,
      y,
      cols[5][1],
      h
    );

    pdf.text(
      Number(r.rate||0).toFixed(2)+"%",
      x+cols[5][1]/2,
      y+h/2+1.8,
      {align:"center"}
    );

    x+=cols[5][1];


    pdf.setFont("helvetica","bold");

    pdf.rect(
      x,
      y,
      cols[6][1],
      h
    );

    pdf.text(
      pdfMoney(r.claim),
      x+cols[6][1]-1.5,
      y+h/2+1.8,
      {align:"right"}
    );

    pdf.setFont("helvetica","normal");

    y+=h;
  });


  if(y>H-25){

    pdf.addPage();

    y=18;
  }


  pdf.setFont("helvetica","bold");
  pdf.setFontSize(10);

  pdf.text(
    "TOTAL CLAIM",
    W-68,
    y+8
  );

  pdf.text(
    pdfMoney(calc.totalClaim),
    W-8,
    y+8,
    {align:"right"}
  );


  pdf.setFont("helvetica","normal");
  pdf.setFontSize(7);

  pdf.text(
    "Generated by Monthly Scheme Claim Calculator",
    W/2,
    H-6,
    {align:"center"}
  );


  pdf.save(
    "Scheme_Claim_"+calc.month1+"_"+calc.month2+".pdf"
  );
}


/* =========================================================
   CALCULATE BUTTON
========================================================= */

calculateBtn.addEventListener("click",async()=>{

  try{

    if(!purchaseInput.files.length){

      alert("Please upload the purchase Excel file.");

      return;
    }


    if(!schemeInput.files.length){

      alert("Please upload the current month scheme chart.");

      return;
    }


    calculateBtn.disabled=true;

    pdfBtn.disabled=true;

    resultEl.classList.add("hidden");


    statusEl.textContent=
      "Reading purchase Excel...";


    purchaseRows=
      await readPurchaseExcel(
        purchaseInput.files[0]
      );


    statusEl.textContent=
      "Reading current month scheme chart...";


    const schemeText=
      await readSchemeFile(
        schemeInput.files[0]
      );


    if(!schemeText.trim()){

      throw new Error(
        "The scheme chart could not be read."
      );
    }


    statusEl.textContent=
      "Detecting products and liability rates...";


    schemeRows=
      parseSchemeRows(schemeText);


    if(!schemeRows.length){

      throw new Error(
        "No scheme products/liability rates were detected from the chart. Please use a clear PDF or image."
      );
    }


    statusEl.textContent=
      "Calculating claim...";


    finalCalc=
      calculateClaim(purchaseRows);


    render(finalCalc);


    pdfBtn.disabled=false;

    statusEl.textContent=
      "Calculation completed successfully.";


  }catch(err){

    console.error(err);

    statusEl.textContent=
      "Error: "+(err.message||String(err));

    alert(
      "Calculation Error:\n\n"+
      (err.message||String(err))
    );

  }finally{

    calculateBtn.disabled=false;
  }

});


/* =========================================================
   PDF BUTTON
========================================================= */

pdfBtn.addEventListener("click",()=>{

  if(!finalCalc){

    alert("Please calculate the claim first.");

    return;
  }

  try{

    makePDF(finalCalc);

  }catch(err){

    console.error(err);

    alert(
      "PDF Error:\n\n"+
      (err.message||String(err))
    );
  }

});


/* =========================================================
   FILE STATUS
========================================================= */

purchaseInput.addEventListener("change",()=>{

  if(purchaseInput.files.length){

    statusEl.textContent=
      "Purchase file selected: "+
      purchaseInput.files[0].name;
  }
});


schemeInput.addEventListener("change",()=>{

  if(schemeInput.files.length){

    statusEl.textContent=
      "Scheme chart selected: "+
      schemeInput.files[0].name;
  }
});

</script>
