<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scheme Claim Report</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>
body{
 margin:0;
 background:#f5f7fb;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;
 color:#172033
}
main{
 max-width:850px;
 margin:auto;
 padding:22px 15px 50px
}
.card{
 background:#fff;
 border-radius:18px;
 padding:18px;
 margin:14px 0;
 box-shadow:0 2px 12px #0001
}
h1{margin:0 0 5px;font-size:28px}
.muted{color:#667085}
label{
 display:block;
 font-weight:700;
 margin:16px 0 7px
}
input,button{
 width:100%;
 box-sizing:border-box;
 padding:14px;
 border-radius:12px;
 font-size:16px
}
input{
 border:1px solid #d0d5dd;
 background:#fff
}
button{
 border:0;
 background:#1257c7;
 color:#fff;
 font-weight:700;
 margin-top:16px
}
#status{
 margin-top:14px;
 padding:12px;
 border-radius:10px;
 background:#eef4ff
}
table{
 width:100%;
 border-collapse:collapse;
 font-size:12px;
 margin-top:14px
}
th,td{
 border:1px solid #ddd;
 padding:7px
}
th{background:#edf3fb}
td:not(:first-child),th:not(:first-child){
 text-align:right
}
.total{
 font-size:21px;
 font-weight:800;
 margin-top:18px
}
</style>
</head>

<body>
<main>

<h1>Scheme Claim Report</h1>

<div class="muted">
Automatic Excel + scheme chart calculator
</div>

<div class="card">

<label>Purchase Excel</label>
<input id="excel" type="file" accept=".xlsx,.xls,.csv">

<label>Current Month Scheme Chart</label>
<input id="chart" type="file" accept="image/*">

<button id="go">Generate Report</button>

<div id="status">
Ready. Upload both files.
</div>

</div>

<div id="out"></div>

</main>

<script>

const status=document.getElementById("status");

function money(n){
 return "₹"+Number(n||0).toLocaleString("en-IN",{
  minimumFractionDigits:2,
  maximumFractionDigits:2
 });
}

function num(v){
 let n=parseFloat(
  String(v??"").replace(/[₹,\s]/g,"")
 );
 return isNaN(n)?0:n;
}

function clean(s){
 return String(s??"")
 .toLowerCase()
 .replace(/[^a-z0-9.]/g," ")
 .replace(/\s+/g," ")
 .trim();
}

function getDate(v){

 if(v instanceof Date)return v;

 if(typeof v==="number"){
  return new Date(
   Date.UTC(1899,11,30)+v*86400000
  );
 }

 let d=new Date(v);

 return isNaN(d)?null:d;
}

function monthKey(d){
 return d.getFullYear()+"-"+
 String(d.getMonth()+1).padStart(2,"0");
}


/* PRODUCT MATCHING */

function matchProduct(name,type){

 let n=clean(name);

 if(type==="pgclassic")
  return n.includes("parle g classic") &&
         n.includes("72 pkt") &&
         n.includes("10.00");

 if(type==="pggold")
  return n.includes("parle g gold") &&
         n.includes("72 pkt") &&
         n.includes("10.00");

 if(type==="magix")
  return n.includes("magix");

 if(type==="dhinchak")
  return n.includes("dhinchak");

 if(type==="rusk")
  return n.includes("rusk");

 if(type==="atta")
  return n.includes("parle g atta");

 if(type==="2020")
  return n.includes("20 20") &&
         (n.includes("butter")||n.includes("cashew")) &&
         n.includes("144 pkt") &&
         n.includes("5.00");

 if(type==="pouch")
  return !n.includes("melody") &&
   (
    n.includes(" pb ") ||
    n.includes(" pbg ") ||
    n.includes(" rol ") ||
    n.includes(" roll ")
   );

 if(type==="jar")
  return n.includes("jar") &&
         !n.includes("melody");

 return false;
}


/* DEFAULT SCHEME RATES */

const base=[
 ["pgclassic","Parle-G Classic ₹10",.04],
 ["pggold","Parle-G Gold ₹10",.04],
 ["magix","Magix",.08],
 ["dhinchak","Dhinchak",.04],
 ["rusk","Rusk",.04],
 ["atta","Atta",.15],
 ["2020","20-20 Butter + Cashew ₹5",.03],
 ["pouch","Confy Pouch",.03],
 ["jar","Confy Jar",.08]
];


/* READ EXCEL */

async function excelRows(file){

 status.innerText="Reading purchase Excel...";

 const wb=XLSX.read(
  await file.arrayBuffer(),
  {type:"array",cellDates:true}
 );

 const ws=wb.Sheets[wb.SheetNames[0]];

 const data=XLSX.utils.sheet_to_json(
  ws,
  {header:1,defval:""}
 );

 let header=data.findIndex(row=>
  row.some(x=>
   String(x).toLowerCase()
   .includes("gross amount")
  )
 );

 if(header<0)
  throw new Error(
   "Gross Amount column not found."
  );

 const h=data[header].map(x=>
  String(x).trim().toLowerCase()
 );

 const dateCol=h.indexOf("grn date");
 const nameCol=h.indexOf("product name");
 const grossCol=h.indexOf("gross amount");

 if(dateCol<0||nameCol<0||grossCol<0)
  throw new Error(
   "GRN Date, Product Name or Gross Amount is missing."
  );

 return data
 .slice(header+1)
 .map(row=>({
  date:getDate(row[dateCol]),
  name:String(row[nameCol]||""),
  gross:num(row[grossCol])
 }))
 .filter(x=>x.date&&x.name);
}


/* READ SCHEME CHART USING OCR */

async function readSchemeChart(file){

 status.innerText="Reading scheme chart...";

 const url=URL.createObjectURL(file);

 const result=await Tesseract.recognize(
  url,
  "eng",
  {
   logger:m=>{
    if(m.status==="recognizing text"){
     status.innerText=
      "Reading scheme chart... "+
      Math.round((m.progress||0)*100)+"%";
    }
   }
  }
 );

 URL.revokeObjectURL(url);

 const text=clean(result.data.text);

 let rates=base.map(x=>x.slice());

 /*
  Finds percentages near each scheme name.
  The highest percentage shown for that scheme
  is used as the liability rate.
 */

 rates.forEach(r=>{

  let aliases=[];

  if(r[0]==="pgclassic")
   aliases=["parle g classic"];

  if(r[0]==="pggold")
   aliases=["parle g gold"];

  if(r[0]==="magix")
   aliases=["magix"];

  if(r[0]==="dhinchak")
   aliases=["dhinchak"];

  if(r[0]==="rusk")
   aliases=["rusk"];

  if(r[0]==="atta")
   aliases=["atta"];

  if(r[0]==="2020")
   aliases=["20 20"];

  if(r[0]==="pouch")
   aliases=["confy pouch"];

  if(r[0]==="jar")
   aliases=["confy jar"];

  let position=-1;

  for(const alias of aliases){
   position=text.indexOf(alias);
   if(position>=0)break;
  }

  if(position>=0){

   let nearby=text.slice(
    position,
    position+350
   );

   let percentages=[
    ...nearby.matchAll(
     /(\d+(?:\.\d+)?)\s*%/g
    )
   ].map(x=>Number(x[1]));

   if(percentages.length){
    r[2]=Math.max(...percentages)/100;
   }

  }

 });

 return rates;
}


/* CALCULATION */

function calculate(rows,rates){

 let months=[
  ...new Set(
   rows.map(r=>monthKey(r.date))
  )
 ].sort();

 if(months.length<2)
  throw new Error(
   "At least two purchase months are required."
  );

 /*
  The two complete previous months are used.
  No date is excluded.
 */

 let month1=months[months.length-2];
 let month2=months[months.length-1];

 let results=[];

 rates.forEach(s=>{

  let products=rows.filter(r=>
   matchProduct(r.name,s[0])
  );

  let amount1=products
   .filter(r=>monthKey(r.date)===month1)
   .reduce((sum,r)=>sum+r.gross,0);

  let amount2=products
   .filter(r=>monthKey(r.date)===month2)
   .reduce((sum,r)=>sum+r.gross,0);

  let average=(amount1+amount2)/2;

  let gate=average*1.05;

  let claim=gate*s[2];

  results.push({
   name:s[1],
   month1:amount1,
   month2:amount2,
   average:average,
   gate:gate,
   rate:s[2],
   claim:claim,
   skus:[
    ...new Set(
     products.map(r=>r.name)
    )
   ]
  });

 });

 return{
  month1:month1,
  month2:month2,
  results:results,
  total:results.reduce(
   (sum,r)=>sum+r.claim,0
  )
 };
}


/* DISPLAY REPORT */

function showReport(c){

 let html=
 '<div class="card">'+
 '<h2>Final Scheme Claim</h2>'+
 '<p><b>Month 1:</b> '+c.month1+
 ' &nbsp;&nbsp; <b>Month 2:</b> '+
 c.month2+'</p>';

 html+=
 '<table>'+
 '<tr>'+
 '<th>Scheme</th>'+
 '<th>Month 1</th>'+
 '<th>Month 2</th>'+
 '<th>Average</th>'+
 '<th>Gate</th>'+
 '<th>Liability</th>'+
 '<th>Claim</th>'+
 '</tr>';

 c.results.forEach(r=>{

  html+=
  '<tr>'+
  '<td>'+r.name+'</td>'+
  '<td>'+money(r.month1)+'</td>'+
  '<td>'+money(r.month2)+'</td>'+
  '<td>'+money(r.average)+'</td>'+
  '<td>'+money(r.gate)+'</td>'+
  '<td>'+(r.rate*100).toFixed(1)+'%</td>'+
  '<td>'+money(r.claim)+'</td>'+
  '</tr>';

 });

 html+='</table>';

 html+=
 '<div class="total">'+
 'FINAL LIABILITY: '+money(c.total)+
 '</div>';

 html+=
 '<button onclick="downloadPDF()">'+
 'Download PDF</button>';

 html+='</div>';

 document.getElementById("out").innerHTML=html;

 window.finalCalculation=c;
}


/* PDF */

function downloadPDF(){

 const {jsPDF}=window.jspdf;

 const doc=new jsPDF({
  orientation:"landscape",
  unit:"mm",
  format:"a4"
 });

 const c=window.finalCalculation;

 doc.setFont("helvetica","bold");
 doc.setFontSize(17);

 doc.text(
  "SCHEME CLAIM REPORT",
  148,14,
  {align:"center"}
 );

 doc.setFont("helvetica","normal");
 doc.setFontSize(8);

 let y=30;

 doc.setFont("helvetica","bold");

 const x=[
  10,72,103,134,164,198,220
 ];

 [
  "Scheme",
  "Month 1",
  "Month 2",
  "Average",
  "Gate",
  "Liability",
  "Claim"
 ].forEach((v,i)=>{
  doc.text(v,x[i],y);
 });

 y+=7;

 doc.setFont("helvetica","normal");

 c.results.forEach(r=>{

  [
   r.name,
   money(r.month1),
   money(r.month2),
   money(r.average),
   money(r.gate),
   (r.rate*100)+"%",
   money(r.claim)
  ].forEach((v,i)=>{
   doc.text(String(v),x[i],y);
  });

  y+=7;

 });

 y+=8;

 doc.setFont("helvetica","bold");
 doc.setFontSize(14);

 doc.text(
  "FINAL LIABILITY: "+money(c.total),
  148,y,
  {align:"center"}
 );

 doc.save("Scheme_Claim_Report.pdf");
}


/* MAIN BUTTON */

document.getElementById("go").onclick=async()=>{

 try{

  const excel=
   document.getElementById("excel").files[0];

  const chart=
   document.getElementById("chart").files[0];

  if(!excel)
   throw new Error(
    "Please upload the purchase Excel."
   );

  if(!chart)
   throw new Error(
    "Please upload the current scheme chart."
   );

  const rows=
   await excelRows(excel);

  const rates=
   await readSchemeChart(chart);

  status.innerText=
   "Calculating report...";

  const calculation=
   calculate(rows,rates);

  showReport(calculation);

  status.innerText=
   "Report generated successfully.";

 }
 catch(error){

  status.innerText=
   "Error: "+error.message;

 }

};

</script>
</body>
</html>
