<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>Scheme Claim Report</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f6fa;
  color:#172033;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

main{
  max-width:1050px;
  margin:auto;
  padding:22px 14px 50px;
}

.header{
  text-align:center;
  margin-bottom:20px;
}

.header h1{
  margin:0;
  font-size:30px;
}

.header p{
  margin:6px 0 0;
  color:#68738a;
  font-size:16px;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin:15px 0;
  box-shadow:0 3px 15px rgba(0,0,0,.07);
}

label{
  display:block;
  font-weight:700;
  margin:14px 0 7px;
}

input[type=file]{
  width:100%;
  padding:13px;
  border:1px solid #ccd3df;
  border-radius:12px;
  background:white;
  font-size:15px;
}

button{
  width:100%;
  border:0;
  border-radius:12px;

  font-size:16px;
  font-weight:700;
  background:#135dcc;
  color:white;
}

button:disabled{
  opacity:.5;
}

#pdfButton{
  background:#202124;
}

.status{
  margin-top:15px;
  padding:13px;
  border-radius:11px;
  background:#eef4ff;

}

  display:none;

.summary{
  display:grid;

.num{

.center{

}

.claim{

}

.total{
  margin-top:18px;

  font-size:21px;
  font-weight:800;

<body>

<main>

  <div class="header">
    <h1>Scheme Claim Report</h1>
    <p>Automatic Monthly Scheme Calculator</p>
  </div>


  <div class="card">

    <label>
      1. Purchase Excel — Previous 2 Complete Months
    </label>

    <input
      id="excelFile"
      type="file"
      accept=".xls,.xlsx,.csv"
    >


    <label>
      2. Current Month Scheme Chart
    </label>

    <input
      id="schemeFile"
      type="file"
      accept="image/*,.pdf"
    >


    <button id="generateButton">
      Generate Report
    </button>


    <div id="status" class="status">
      Ready.
    </div>

  </div>


  <div id="resultCard" class="card hidden">

    <div class="summary">

      <div class="summaryBox">
        <small>Purchase Month 1</small>
        <strong id="month1">-</strong>
      </div>

      <div class="summaryBox">
        <small>Purchase Month 2</small>
        <strong id="month2">-</strong>
      </div>

      <div class="summaryBox">
        <small>Total Claim</small>
        <strong id="totalClaim">Rs. 0.00</strong>
      </div>

    </div>

  </div>


  <div id="reportCard" class="card hidden">

    <h2>Scheme Claim Report</h2>

    <div class="tableWrap">

      <table>

        <thead>

          <tr>
            <th>Product / Scheme</th>
            <th>Month 1</th>
            <th>Month 2</th>
            <th>Average</th>
            <th>Gate</th>
            <th>Liability %</th>
            <th>Claim Amount</th>
          </tr>

        </thead>

        <tbody id="reportBody"></tbody>

      </table>

    </div>


    <div class="total">
      Total Claim:
      <span id="bottomTotal">Rs. 0.00</span>
    </div>


    <button id="pdfButton">
      Download PDF
    </button>

  </div>

</main>


<script>

"use strict";


/* =========================================================
   ELEMENTS
========================================================= */

const excelFile =
  document.getElementById("excelFile");

const schemeFile =
  document.getElementById("schemeFile");

const generateButton =
  document.getElementById("generateButton");

const pdfButton =
  document.getElementById("pdfButton");

const statusBox =
  document.getElementById("status");

const resultCard =
  document.getElementById("resultCard");

const reportCard =
  document.getElementById("reportCard");

const reportBody =
  document.getElementById("reportBody");

let finalReport=null;


/* =========================================================
   BASIC HELPERS
========================================================= */

function setStatus(text){
  statusBox.textContent=text;
}


function cleanText(value){

  return String(value ?? "")
    .toLowerCase()
    .replace(/₹/g," rs ")
    .replace(/rs\./g," rs ")
    .replace(/[^a-z0-9.%\- ]/g," ")
    .replace(/\s+/g," ")
    .trim();
}


function displayMoney(value){

  return "₹" +
    Number(value || 0).toLocaleString(
      "en-IN",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );
}


function pdfMoney(value){

  return "Rs. " +
    Number(value || 0).toLocaleString(
      "en-IN",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );
}


function amount(value){

  if(typeof value==="number"){
    return isFinite(value) ? value : 0;
  }

  let s=String(value ?? "")
    .replace(/₹/g,"")
    .replace(/Rs\.?/gi,"")
    .replace(/,/g,"")
    .trim();

  let n=parseFloat(s);

  return isFinite(n) ? n : 0;
}


function excelDate(value){

  if(value instanceof Date && !isNaN(value)){
    return new Date(value);
  }


  if(typeof value==="number"){

    const utc =
      new Date(
        Date.UTC(1899,11,30)
      );

    utc.setUTCDate(
      utc.getUTCDate()+value
    );

    return new Date(
      utc.getUTCFullYear(),
      utc.getUTCMonth(),
      utc.getUTCDate()
    );
  }


  const s=String(value ?? "").trim();

  if(!s)
    return null;


  let d=new Date(s);

  if(!isNaN(d))
    return d;


  let m=s.match(
    /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/
  );

  if(m){

    d=new Date(
      Number(m[3]),
      Number(m[2])-1,
      Number(m[1])
    );

    if(!isNaN(d))
      return d;
  }


  return null;
}


function monthKey(date){

  return date.getFullYear() +
    "-" +
    String(
      date.getMonth()+1
    ).padStart(2,"0");
}


function monthDisplay(key){

  const p=key.split("-");

  const names=[
    "January","February","March",
    "April","May","June",
    "July","August","September",
    "October","November","December"
  ];

  return names[
    Number(p[1])-1
  ]+" "+p[0];
}


/* =========================================================
   EXCEL READER
========================================================= */

async function readExcel(file){

  const buffer =
    await file.arrayBuffer();


  const workbook =
    XLSX.read(
      buffer,
      {
        type:"array",
        cellDates:true
      }
    );


  let sheet=null;


  for(
    const sheetName of workbook.SheetNames
  ){

    const candidate =
      workbook.Sheets[sheetName];

    const rows =
      XLSX.utils.sheet_to_json(
        candidate,
        {
          header:1,
          defval:""
        }
      );


    if(rows.length){

      sheet=candidate;
      break;
    }
  }


  if(!sheet)
    throw new Error(
      "No data found in the purchase Excel."
    );


  const rows =
    XLSX.utils.sheet_to_json(
      sheet,
      {
        header:1,
        defval:""
      }
    );


  /*
    IMPORTANT:
    The purchase file can have title/blank rows.
    Therefore search ALL rows for the real header.
  */

  let headerIndex=-1;


  for(let i=0;i<rows.length;i++){

    const r =
      rows[i].map(
        x=>cleanText(x)
      );


    if(
      r.includes("grn date") &&
      r.includes("product name") &&
      r.includes("gross amount")
    ){

      headerIndex=i;
      break;
    }
  }


  if(headerIndex<0){

    throw new Error(
      "Excel columns GRN Date, Product Name and Gross Amount could not be found."
    );
  }


  const headers =
    rows[headerIndex].map(
      x=>cleanText(x)
    );


  const dateIndex =
    headers.indexOf("grn date");

  const productIndex =
    headers.indexOf("product name");

  const grossIndex =
    headers.indexOf("gross amount");


  const output=[];


  for(
    let i=headerIndex+1;
    i<rows.length;
    i++
  ){

    const r=rows[i];


    const date =
      excelDate(
        r[dateIndex]
      );


    const product =
      String(
        r[productIndex] ?? ""
      ).trim();


    const gross =
      amount(
        r[grossIndex]
      );


    if(
      date &&
      product
    ){

      output.push({
        date:date,
        product:product,
        gross:gross
      });
    }
  }


  if(!output.length){

    throw new Error(
      "No purchase records were found below the Excel header."
    );
  }


  return output;
}


/* =========================================================
   SCHEME CHART OCR
========================================================= */

async function readSchemeChart(file){

  if(
    file.type==="application/pdf" ||
    file.name.toLowerCase().endsWith(".pdf")
  ){

    throw new Error(
      "For the automatic calculator, please upload the scheme chart as PNG/JPG image. This gives more reliable OCR."
    );
  }


  setStatus(
    "Reading current scheme chart..."
  );


  const result =
    await Tesseract.recognize(
      file,
      "eng",
      {
        logger:function(message){

          if(
            message.status===
            "recognizing text"
          ){

            const percent =
              Math.round(
                (message.progress || 0)*100
              );

            setStatus(
              "Reading scheme chart... "+
              percent+"%"
            );
          }
        }
      }
    );


  return result.data.text || "";
}


/* =========================================================
   SCHEME PARSING
========================================================= */

function findPercentages(text){

  const found=[];

  const re=
    /(\d+(?:\.\d+)?)\s*%/g;

  let m;


  while(
    (m=re.exec(text))!==null
  ){

    const n=parseFloat(m[1]);

    if(
      n>0 &&
      n<=100
    ){

      found.push(n);
    }
  }


  return [
    ...new Set(found)
  ];
}


function findMRPs(text){

  const found=[];


  let re=
    /(?:mrp|m\.r\.p)\s*[-:]?\s*(?:rs\.?|₹)?\s*(\d+(?:\.\d+)?)/gi;


  let m;


  while(
    (m=re.exec(text))!==null
  ){

    found.push(
      parseFloat(m[1])
    );
  }


  /*
    Also detect explicit ₹ values.
  */

  re=/₹\s*(\d+(?:\.\d+)?)/g;


  while(
    (m=re.exec(text))!==null
  ){

    found.push(
      parseFloat(m[1])
    );
  }


  return [
    ...new Set(found)
  ];
}


function schemeProductName(line){

  let x=cleanText(line);


  /*
    Remove obvious slab/rate text.
  */

  x=x
    .replace(/\d+(?:\.\d+)?\s*%/g," ")
    .replace(/\b\d+\s*[-–]\s*\d+\b/g," ")
    .replace(/\b\d+\+\b/g," ")
    .replace(/\s+/g," ")
    .trim();


  return x;
}


function productSimilarity(
  purchaseName,
  schemeName
){

  const p=cleanText(
    purchaseName
  );

  const s=cleanText(
    schemeName
  );


  if(!p || !s)
    return false;


  /*
    Special current-month combined Confy head.
  */

  if(
    s.includes("confy") &&
    (
      s.includes("pouch") ||
      s.includes("jar")
    )
  ){

    return isConfyProduct(
      purchaseName
    );
  }


  /*
    Important known product families.
    This is ONLY matching.
    Liability still comes from current chart.
  */

  if(
    s.includes("parle") &&
    s.includes("g") &&
    s.includes("classic")
  ){

    return (
      p.includes("parle g classic")
    );
  }


  if(
    s.includes("parle") &&
    s.includes("g") &&
    s.includes("gold")
  ){

    return (
      p.includes("parle g gold")
    );
  }


  if(s.includes("magix"))
    return p.includes("magix");


  if(s.includes("dhinchak"))
    return p.includes("dhinchak");


  if(s.includes("bourbon"))
    return p.includes("bourbon");


  if(s.includes("rusk"))
    return p.includes("rusk");


  if(s.includes("atta"))
    return p.includes("atta");


  if(
    s.includes("20 20") ||
    s.includes("2020")
  ){

    return (
      p.includes("20 20") &&
      (
        p.includes("butter") ||
        p.includes("cashew")
      )
    );
  }


  /*
    Generic fallback.
  */

  const words =
    s.split(" ")
      .filter(
        w =>
          w.length>=3 &&
          ![
            "the",
            "and",
            "regular",
            "extra",
            "scheme",
            "product"
          ].includes(w)
      );


  if(!words.length)
    return false;


  let score=0;


  words.forEach(
    w=>{
      if(p.includes(w))
        score++;
    }
  );


  return (
    score >=
    Math.max(
      1,
      Math.ceil(words.length*.55)
    )
  );
}


/* =========================================================
   CONFY
========================================================= */

function isConfyProduct(name){

  const x=cleanText(name);


  if(!x.includes("confy"))
    return false;


  /*
    Melody is excluded.
  */

  if(x.includes("melody"))
    return false;


  /*
    Pouch and Jar together.
  */

  return (
    x.includes("pb") ||
    x.includes("pbg") ||
    x.includes("rol") ||
    x.includes("roll") ||
    x.includes("jar") ||
    x.includes("funtoosh")
  );
}


/* =========================================================
   BUILD SCHEME ROWS
========================================================= */

function parseSchemeChart(text){

  const lines =
    text
      .split(/\r?\n/)
      .map(
        x=>x.trim()
      )
      .filter(Boolean);


  const result=[];


  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const current=lines[i];

    const rates =
      findPercentages(
        current
      );


    /*
      Sometimes OCR puts product on one line
      and liability on the next line.
    */

    const next =
      i+1<lines.length
        ? findPercentages(
            lines[i+1]
          )
        : [];


    const allRates=[
      ...rates,
      ...next
    ];


    if(!allRates.length)
      continue;


    let name=current;


    /*
      If current line contains almost no letters,
      use previous line as product name.
    */

    const letters =
      (
        current.match(
          /[A-Za-z]{3,}/g
        ) || []
      ).length;


    if(
      letters<=1 &&
      i>0
    ){

      name=lines[i-1];
    }


    const normalized =
      cleanText(name);


    const productWords=[
      "parle",
      "magix",
      "dhinchak",
      "bourbon",
      "confy",
      "rusk",
      "atta",
      "20 20",
      "2020",
      "platina"
    ];


    const looksLikeProduct =
      productWords.some(
        word =>
          normalized.includes(word)
      );


    if(!looksLikeProduct)
      continue;


    const context =
      lines.slice(
        Math.max(0,i-1),
        Math.min(
          lines.length,
          i+2
        )
      ).join(" ");


    result.push({

      name:schemeProductName(name),

      rates:[
        ...new Set(allRates)
      ].sort(
        (a,b)=>a-b
      ),

      mrps:findMRPs(context),

      raw:context
    });
  }


  /*
    Merge duplicate OCR detections.
  */

  const merged=[];


  result.forEach(r=>{

    const existing =
      merged.find(
        x =>
          cleanText(x.name) ===
          cleanText(r.name)
      );


    if(existing){

      existing.rates=[
        ...new Set([
          ...existing.rates,
          ...r.rates
        ])
      ];

      existing.rates.sort(
        (a,b)=>a-b
      );


      existing.mrps=[
        ...new Set([
          ...existing.mrps,
          ...r.mrps
        ])
      ];

    }else{

      merged.push(r);
    }
  });


  /*
    Combined Confy Pouch & Jar.
  */

  const confy =
    merged.filter(
      r =>
        cleanText(r.name).includes("confy") &&
        (
          cleanText(r.name).includes("pouch") ||
          cleanText(r.name).includes("jar")
        )
    );


  if(confy.length){

    const rates =
      confy.flatMap(
        x=>x.rates
      );


    return [
      ...merged.filter(
        r =>
          !(
            cleanText(r.name).includes("confy") &&
            (
              cleanText(r.name).includes("pouch") ||
              cleanText(r.name).includes("jar")
            )
          )
      ),

      {
        name:"CONFY POUCH & JAR",

        rates:[
          Math.max(...rates)
        ],

        mrps:[],

        combined:true
      }
    ];
  }


  return merged;
}


/* =========================================================
   GET SCHEME FOR PURCHASE PRODUCT
========================================================= */

function getScheme(product){

  for(
    const scheme of parsedSchemes
  ){

    if(
      scheme.combined &&
      isConfyProduct(product)
    ){

      return scheme;
    }


    if(
      !scheme.combined &&
      productSimilarity(
        product,
        scheme.name
      )
    ){

      /*
        If chart explicitly gives MRP,
        require exact MRP where the purchase SKU
        contains an explicit MRP.
      */

      if(
        scheme.mrps &&
        scheme.mrps.length
      ){

        const m =
          cleanText(product).match(
            /mrp\s*[-:]?\s*(\d+(?:\.\d+)?)/i
          );


        if(m){

          const purchaseMRP =
            parseFloat(m[1]);


          const exact =
            scheme.mrps.some(
              x =>
                Math.abs(
                  x-purchaseMRP
                ) < .01
            );


          if(!exact)
            continue;
        }
      }


      return scheme;
    }
  }


  return null;
}


/* =========================================================
   CALCULATE
========================================================= */

let parsedSchemes=[];


function calculateClaim(rows){

  /*
    Find all purchase months.
  */

  const months=[
    ...new Set(
      rows
        .map(
          r=>monthKey(r.date)
        )
    )
  ].sort();


  if(months.length<2){

    throw new Error(
      "At least two purchase months are required."
    );
  }


  /*
    Latest two complete months in uploaded purchase data.
  */

  const month2 =
    months[months.length-1];

  const month1 =
    months[months.length-2];


  const groups={};


  rows.forEach(r=>{

    const mk=
      monthKey(r.date);


    if(
      mk!==month1 &&
      mk!==month2
    )
      return;


    const scheme =
      getScheme(r.product);


    if(!scheme)
      return;


    /*
      Confy Pouch & Jar are combined.
    */

    const key =
      scheme.combined
        ? "CONFY POUCH & JAR"
        : r.product;


    if(!groups[key]){

      groups[key]={

        product:
          scheme.combined
            ? "CONFY POUCH & JAR"
            : r.product,

        scheme:scheme,

        month1:0,

        month2:0
      };
    }


    if(mk===month1){

      groups[key].month1 +=
        r.gross;
    }


    if(mk===month2){

      groups[key].month2 +=
        r.gross;
    }
  });


  const output=[];


  Object.values(groups)
    .forEach(g=>{

      const average =
        (
          g.month1+
          g.month2
        )/2;


      /*
        Gate = average × 1.05
      */

      const gate =
        average*1.05;


      /*
        Current month chart:
        highest applicable liability rate.
      */

      const liability =
        Math.max(
          ...(g.scheme.rates || [0])
        );


      /*
        Claim = Gate × Liability %
      */

      const claim =
        gate*liability/100;


      output.push({

        product:g.product,

        month1:g.month1,

        month2:g.month2,

        average:average,

        gate:gate,

        liability:liability,

        claim:claim
      });
    });


  output.sort(
    (a,b)=>
      b.claim-a.claim
  );


  const total =
    output.reduce(
      (sum,r)=>
        sum+r.claim,
      0
    );


  return {

    month1:month1,

    month2:month2,

    rows:output,

    total:total
  };
}


/* =========================================================
   RENDER REPORT
========================================================= */

function renderReport(report){

  resultCard.classList.remove(
    "hidden"
  );

  reportCard.classList.remove(
    "hidden"
  );


  document.getElementById(
    "month1"
  ).textContent=
    monthDisplay(
      report.month1
    );


  document.getElementById(
    "month2"
  ).textContent=
    monthDisplay(
      report.month2
    );


  document.getElementById(
    "totalClaim"
  ).textContent=
    displayMoney(
      report.total
    );


  document.getElementById(
    "bottomTotal"
  ).textContent=
    displayMoney(
      report.total
    );


  reportBody.innerHTML="";


  report.rows.forEach(
    row=>{

      const tr=
        document.createElement("tr");


      tr.innerHTML=`

        <td>
          ${escapeHtml(
            row.product
          )}
        </td>

        <td class="num">
          ${displayMoney(
            row.month1
          )}
        </td>

        <td class="num">
          ${displayMoney(
            row.month2
          )}
        </td>

        <td class="num">
          ${displayMoney(
            row.average
          )}
        </td>

        <td class="num">
          ${displayMoney(
            row.gate
          )}
        </td>

        <td class="center">
          ${Number(
            row.liability
          ).toFixed(2)}%
        </td>

        <td class="num claim">
          ${displayMoney(
            row.claim
          )}
        </td>

      `;


      reportBody.appendChild(tr);
    }
  );
}


function escapeHtml(text){

  return String(text ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}


/* =========================================================
   PDF
========================================================= */

function makePDF(report){

  if(
    !window.jspdf ||
    !window.jspdf.jsPDF
  ){

    throw new Error(
      "PDF library is not loaded. Please refresh the page and try again."
    );
  }


  const jsPDF =
    window.jspdf.jsPDF;


  const doc =
    new jsPDF({
      orientation:"landscape",
      unit:"mm",
      format:"a4"
    });


  const pageWidth =
    doc.internal.pageSize.getWidth();

  const pageHeight =
    doc.internal.pageSize.getHeight();


  const left=7;

  const columns=[
    ["Product / Scheme",76],
    ["Month 1",30],
    ["Month 2",30],
    ["Average",32],
    ["Gate",32],
    ["Liability %",27],
    ["Claim Amount",39]
  ];


  doc.setFont(
    "helvetica",
    "bold"
  );

  doc.setFontSize(16);


  doc.text(
    "MONTHLY SCHEME CLAIM REPORT",
    pageWidth/2,
    12,
    {
      align:"center"
    }
  );


  doc.setFont(
    "helvetica",
    "normal"
  );

  doc.setFontSize(8);


  doc.text(
    "Purchase Months: "+
    monthDisplay(report.month1)+
    " and "+
    monthDisplay(report.month2),
    pageWidth/2,
    19,
    {
      align:"center"
    }
  );


  function drawHeader(y){

    let x=left;


    doc.setFont(
      "helvetica",
      "bold"
    );

    doc.setFontSize(7.5);


    columns.forEach(
      column=>{

        doc.rect(
          x,
          y,
          column[1],
          8
        );


        doc.text(
          column[0],
          x+column[1]/2,
          y+5.2,
          {
            align:"center"
          }
        );


        x+=column[1];
      }
    );
  }


  let y=27;

  drawHeader(y);

  y+=8;


  report.rows.forEach(
    row=>{

      const product =
        String(
          row.product || ""
        )
        .replace(/₹/g,"Rs.")
        .replace(/[^\x20-\x7E]/g," ");


      const productLines =
        doc.splitTextToSize(
          product,
          columns[0][1]-3
        );


      const rowHeight =
        Math.max(
          8,
          productLines.length*3.5+3
        );


      if(
        y+rowHeight >
        pageHeight-18
      ){

        doc.addPage();

        y=15;

        drawHeader(y);

        y+=8;
      }


      let x=left;


      doc.setFont(
        "helvetica",
        "normal"
      );

      doc.setFontSize(7);


      /*
        Product
      */

      doc.rect(
        x,
        y,
        columns[0][1],
        rowHeight
      );


      doc.text(
        productLines,
        x+1.5,
        y+4.2
      );


      x+=columns[0][1];


      /*
        Money columns
      */

      const moneyValues=[
        row.month1,
        row.month2,
        row.average,
        row.gate
      ];


      for(
        let i=0;
        i<moneyValues.length;
        i++
      ){

        doc.rect(
          x,
          y,
          columns[i+1][1],
          rowHeight
        );


        doc.text(
          pdfMoney(
            moneyValues[i]
          ),
          x+columns[i+1][1]-1.5,
          y+rowHeight/2+1.8,
          {
            align:"right"
          }
        );


        x+=columns[i+1][1];
      }


      /*
        Liability
      */

      doc.rect(
        x,
        y,
        columns[5][1],
        rowHeight
      );


      doc.text(
        Number(
          row.liability
        ).toFixed(2)+"%",
        x+columns[5][1]/2,
        y+rowHeight/2+1.8,
        {
          align:"center"
        }
      );


      x+=columns[5][1];


      /*
        Claim
      */

      doc.setFont(
        "helvetica",
        "bold"
      );


      doc.rect(
        x,
        y,
        columns[6][1],
        rowHeight
      );


      doc.text(
        pdfMoney(
          row.claim
        ),
        x+columns[6][1]-1.5,
        y+rowHeight/2+1.8,
        {
          align:"right"
        }
      );


      y+=rowHeight;
    }
  );


  if(
    y+15 >
    pageHeight-8
  ){

    doc.addPage();

    y=18;
  }


  doc.setFont(
    "helvetica",
    "bold"
  );

  doc.setFontSize(10);


  doc.text(
    "TOTAL CLAIM",
    pageWidth-70,
    y+8
  );


  doc.text(
    pdfMoney(
      report.total
    ),
    pageWidth-8,
    y+8,
    {
      align:"right"
    }
  );


  doc.setFont(
    "helvetica",
    "normal"
  );

  doc.setFontSize(7);


  doc.text(
    "Generated by Monthly Scheme Claim Calculator",
    pageWidth/2,
    pageHeight-6,
    {
      align:"center"
    }
  );


  doc.save(
    "Scheme_Claim_"+
    report.month1+
    "_"+
    report.month2+
    ".pdf"
  );
}


/* =========================================================
   MAIN BUTTON
========================================================= */

generateButton.addEventListener(
  "click",
  async function(){

    try{

      if(
        !excelFile.files ||
        !excelFile.files.length
      ){

        alert(
          "Please upload the purchase Excel file."
        );

        return;
      }


      if(
        !schemeFile.files ||
        !schemeFile.files.length
      ){

        alert(
          "Please upload the current month scheme chart."
        );

        return;
      }


      generateButton.disabled=true;

      pdfButton.disabled=true;

      resultCard.classList.add(
        "hidden"
      );

      reportCard.classList.add(
        "hidden"
      );


      setStatus(
        "Reading purchase Excel..."
      );


      const purchases =
        await readExcel(
          excelFile.files[0]
        );


      setStatus(
        "Reading current month scheme chart..."
      );


      const chartText =
        await readSchemeChart(
          schemeFile.files[0]
        );


      if(
        !chartText.trim()
      ){

        throw new Error(
          "No text could be read from the scheme chart."
        );
      }


      setStatus(
        "Detecting current-month products and liability rates..."
      );


      parsedSchemes =
        parseSchemeChart(
          chartText
        );


      if(
        !parsedSchemes.length
      ){

        throw new Error(
          "The current scheme chart could not be read clearly enough to identify scheme products and liability rates."
        );
      }


      setStatus(
        "Calculating claim from Gross Amount..."
      );


      const report =
        calculateClaim(
          purchases
        );


      finalReport=report;


      renderReport(
        report
      );


      pdfButton.disabled=false;


      setStatus(
        "Report generated successfully."
      );


    }catch(error){

      console.error(error);


      setStatus(
        "Error: "+
        (
          error.message ||
          String(error)
        )
      );


      alert(
        "Calculation Error:\n\n"+
        (
          error.message ||
          String(error)
        )
      );


    }finally{

      generateButton.disabled=false;
    }

  }
);


/* =========================================================
   PDF BUTTON
========================================================= */

pdfButton.addEventListener(
  "click",
  function(){

    if(!finalReport){

      alert(
        "Please generate the report first."
      );

      return;
    }


    try{

      makePDF(
        finalReport
      );

    }catch(error){

      console.error(error);


      alert(
        "PDF Error:\n\n"+
        (
          error.message ||
          String(error)
        )
      );
    }
  }
);
