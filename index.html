<script>
"use strict";

/* =========================================================
   BASIC HELPERS
========================================================= */

const $ = id => document.getElementById(id);

function setStatus(text, type=""){
  const el=$("status");
  el.className="status "+(type||"");
  el.textContent=text;
  el.classList.remove("hidden");
}

function setProgress(percent){
  $("progressBox").classList.remove("hidden");
  $("progressBar").style.width=Math.max(0,Math.min(100,percent))+"%";
}

function money(n){
  return "Rs. "+Number(n||0).toLocaleString("en-IN",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });
}

function cleanText(s){
  return String(s||"")
    .replace(/[|¦]/g," ")
    .replace(/[“”‘’]/g,"'")
    .replace(/\s+/g," ")
    .trim();
}

function norm(s){
  return cleanText(s)
    .toLowerCase()
    .replace(/mclody/g,"melody")
    .replace(/mel0dy/g,"melody")
    .replace(/poppin\b/g,"poppins")
    .replace(/p0ppins/g,"poppins")
    .replace(/\bp\.?\s*b\.?\s*/g,"pb ")
    .replace(/\bp\.?\s*b\.?\s*g\.?\s*/g,"pbg ")
    .replace(/\broll\b/g,"roll")
    .replace(/\brol\b/g,"roll");
}

function numberFromText(v){
  if(v===null || v===undefined || v==="") return 0;
  let s=String(v)
    .replace(/₹/g,"")
    .replace(/Rs\.?/gi,"")
    .replace(/,/g,"")
    .replace(/[^\d.\-]/g,"");
  const n=parseFloat(s);
  return Number.isFinite(n)?n:0;
}

function normalizeMRP(v){
  const n=numberFromText(v);
  return n>0 ? Math.round(n*100)/100 : null;
}

function extractMRP(text){
  const s=norm(text);

  let m=s.match(
    /(?:mrp|m\.r\.p|rs|inr)\s*[-.:]?\s*(\d+(?:\.\d+)?)\s*(?:\/-|\/)?/i
  );

  if(m) return normalizeMRP(m[1]);

  /* Handles OCR such as "10.00" after MRP was damaged */
  m=s.match(/\bmrp\b[^\d]{0,8}(\d+(?:\.\d+)?)/i);
  if(m) return normalizeMRP(m[1]);

  return null;
}

/* =========================================================
   IMAGE PREPROCESSING
========================================================= */

function loadImage(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=reject;
    img.src=URL.createObjectURL(file);
  });
}

function makeCanvas(img, mode){
  const scale=3;

  const maxWidth=2400;
  const scaleFactor=Math.min(scale,maxWidth/img.width);

  const w=Math.round(img.width*scaleFactor);
  const h=Math.round(img.height*scaleFactor);

  const c=document.createElement("canvas");
  c.width=w;
  c.height=h;

  const ctx=c.getContext("2d",{willReadFrequently:true});

  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,w,h);
  ctx.drawImage(img,0,0,w,h);

  if(mode==="threshold"){
    const data=ctx.getImageData(0,0,w,h);
    const d=data.data;

    for(let i=0;i<d.length;i+=4){
      const gray=
        0.299*d[i]+
        0.587*d[i+1]+
        0.114*d[i+2];

      const v=gray<175?0:255;

      d[i]=v;
      d[i+1]=v;
      d[i+2]=v;
    }

    ctx.putImageData(data,0,0);
  }

  return c;
}

/* =========================================================
   OCR
========================================================= */

async function runOCR(canvas,worker){
  const result=await worker.recognize(canvas);

  const data=result.data || {};
  const words=(data.words||[]).map(w=>({
    text:cleanText(w.text),
    conf:Number(w.confidence||w.conf||0),
    x:Number(w.bbox?.x0||0),
    y:Number(w.bbox?.y0||0),
    x1:Number(w.bbox?.x1||0),
    y1:Number(w.bbox?.y1||0)
  })).filter(w=>w.text && w.conf>=15);

  return {
    words,
    text:data.text||""
  };
}

/* =========================================================
   OCR ROW RECONSTRUCTION
========================================================= */

function makeRows(words){
  const sorted=[...words].sort((a,b)=>{
    const ay=(a.y+a.y1)/2;
    const by=(b.y+b.y1)/2;
    if(Math.abs(ay-by)>8) return ay-by;
    return a.x-b.x;
  });

  const rows=[];

  for(const w of sorted){
    const cy=(w.y+w.y1)/2;

    let best=null;
    let bestDiff=999;

    for(const row of rows){
      const diff=Math.abs(cy-row.cy);

      if(diff<bestDiff && diff<=14){
        best=row;
        bestDiff=diff;
      }
    }

    if(!best){
      rows.push({
        cy,
        words:[w]
      });
    }else{
      best.words.push(w);

      best.cy=
        best.words.reduce(
          (sum,z)=>
            sum+(z.y+z.y1)/2,
          0
        )/best.words.length;
    }
  }

  for(const row of rows){
    row.words.sort((a,b)=>a.x-b.x);
    row.text=cleanText(row.words.map(w=>w.text).join(" "));
    row.x0=Math.min(...row.words.map(w=>w.x));
    row.x1=Math.max(...row.words.map(w=>w.x1));
  }

  rows.sort((a,b)=>a.cy-b.cy);

  return rows;
}

/* =========================================================
   PERCENTAGE EXTRACTION
========================================================= */

function extractPercentagesFromRow(row){
  const out=[];

  const words=row.words;

  for(let i=0;i<words.length;i++){
    const t=words[i].text
      .replace(/%/g,"%")
      .replace(/[oO]/g,"0");

    let m=t.match(/^(\d+(?:\.\d+)?)%$/);

    if(m){
      const n=parseFloat(m[1]);
      if(n>0 && n<=100){
        out.push({
          value:n,
          x:words[i].x,
          y:row.cy
        });
      }
      continue;
    }

    if(/^\d+(?:\.\d+)?$/.test(t)){
      const n=parseFloat(t);

      if(n>0 && n<=100){
        const next=words[i+1];

        if(next && /^%+$/.test(next.text)){
          out.push({
            value:n,
            x:words[i].x,
            y:row.cy
          });
        }
      }
    }
  }

  /* Handles OCR where "8%" becomes "8 %", or 8% has punctuation */
  const text=norm(row.text)
    .replace(/,/g," ");

  const matches=text.match(
    /\b(\d+(?:\.\d+)?)\s*%/g
  )||[];

  for(const item of matches){
    const m=item.match(/(\d+(?:\.\d+)?)/);
    if(!m) continue;

    const n=parseFloat(m[1]);

    if(n>0 && n<=100){
      if(!out.some(z=>Math.abs(z.value-n)<0.001)){
        out.push({
          value:n,
          x:row.x1,
          y:row.cy
        });
      }
    }
  }

  return out;
}

/* =========================================================
   IDENTIFY TABLE SCHEME LABELS
========================================================= */

const HEADER_WORDS=[
  "proposal",
  "proposal number",
  "number",
  "date",
  "company",
  "region",
  "state",
  "scheme on",
  "lib",
  "liability",
  "from",
  "to",
  "quantity",
  "qty",
  "cases",
  "slab",
  "page",
  "valid",
  "period",
  "mrp"
];

function isHeaderRow(text){
  const s=norm(text);

  if(!s) return true;

  let hits=0;

  for(const h of HEADER_WORDS){
    if(s===h || s.includes(" "+h+" ") || s.startsWith(h+" ")){
      hits++;
    }
  }

  return hits>=2;
}

function meaningfulSchemeLabel(text){
  let s=cleanText(text);

  if(!s) return false;

  if(isHeaderRow(s)) return false;

  const n=norm(s);

  /* Pure numbers are not scheme labels */
  if(/^[\d\s.,/%\-]+$/.test(n)) return false;

  /* Ignore table-column labels */
  if(
    /^(from|to|scheme|scheme on|lib|lib %|liability|qty|quantity)$/i
      .test(n)
  ) return false;

  /* Need real alphabetic content */
  const alpha=(n.match(/[a-z]/g)||[]).length;

  if(alpha<3) return false;

  /*
     A real product/scheme name generally has either
     multiple words or a recognizable product-like token.
  */
  const tokens=n.split(/\s+/).filter(Boolean);

  if(tokens.length>=2) return true;

  return alpha>=5;
}

/* =========================================================
   BUILD SCHEME BLOCKS
========================================================= */

function buildSchemeBlocks(rows){
  const allPercentRows=rows.map(r=>({
    row:r,
    percentages:extractPercentagesFromRow(r)
  }));

  const candidateIndices=[];

  for(let i=0;i<rows.length;i++){
    const r=rows[i];

    /*
      Only use text on the left side as the scheme label.
      The current chart has product/scheme names in the left
      column and liability percentages in a separate column.
    */
    const leftWords=r.words.filter(w=>w.x < (r.x1+1)*0.55);

    const leftText=cleanText(
      leftWords.map(w=>w.text).join(" ")
    );

    if(meaningfulSchemeLabel(leftText)){
      candidateIndices.push(i);
    }
  }

  /*
    Remove consecutive duplicate/wrapped candidates.
  */
  const unique=[];

  for(const idx of candidateIndices){
    if(!unique.length){
      unique.push(idx);
      continue;
    }

    const prev=unique[unique.length-1];

    if(rows[idx].cy-rows[prev].cy<32){
      const old=norm(rows[prev].text);
      const cur=norm(rows[idx].text);

      if(cur.length>old.length){
        unique[unique.length-1]=idx;
      }
    }else{
      unique.push(idx);
    }
  }

  const blocks=[];

  for(let p=0;p<unique.length;p++){
    const start=unique[p];
    const end=p+1<unique.length
      ? unique[p+1]
      : rows.length;

    const labelRows=[];

    /*
      Include the candidate row and closely following
      text-only rows before the slab percentages.
    */
    for(let i=start;i<end;i++){
      const r=rows[i];

      if(i===start){
        labelRows.push(r);
        continue;
      }

      const ps=extractPercentagesFromRow(r);

      if(ps.length){
        break;
      }

      const leftWords=r.words.filter(
        w=>w.x<(r.x1+1)*0.55
      );

      const leftText=cleanText(
        leftWords.map(w=>w.text).join(" ")
      );

      if(
        meaningfulSchemeLabel(leftText) &&
        r.cy-rows[start].cy<40
      ){
        labelRows.push(r);
      }else{
        break;
      }
    }

    let label=cleanText(
      labelRows.map(r=>{
        const leftWords=r.words.filter(
          w=>w.x<(r.x1+1)*0.65
        );
        return leftWords.map(w=>w.text).join(" ");
      }).join(" ")
    );

    if(!meaningfulSchemeLabel(label)) continue;

    const percentages=[];

    for(let i=start;i<end;i++){
      const ps=extractPercentagesFromRow(rows[i]);

      for(const x of ps){
        percentages.push(x.value);
      }
    }

    /*
      Also check nearby rows immediately after the label.
      This is important for charts where the product name is
      on one row and From/To/Lib% are on following rows.
    */
    if(!percentages.length){
      for(
        let i=start+1;
        i<Math.min(rows.length,start+8);
        i++
      ){
        const ps=extractPercentagesFromRow(rows[i]);

        for(const x of ps){
          percentages.push(x.value);
        }
      }
    }

    if(!percentages.length) continue;

    const cleanRates=
      percentages
      .filter(x=>x>0 && x<=100)
      .map(Number);

    if(!cleanRates.length) continue;

    const highest=Math.max(...cleanRates);

    blocks.push({
      name:cleanText(label),
      rates:[...new Set(cleanRates)].sort((a,b)=>a-b),
      rate:highest,
      mrp:extractMRP(label)
    });
  }

  return blocks;
}

/* =========================================================
   FALLBACK PRODUCT NAME EXTRACTION
========================================================= */

function cleanSchemeName(name){
  let s=norm(name);

  s=s
    .replace(/\bfrom\b.*$/i,"")
    .replace(/\bto\b.*$/i,"")
    .replace(/\bscheme on\b.*$/i,"")
    .replace(/\blib(?:iability)?\b.*$/i,"")
    .replace(/\b\d+(?:\.\d+)?\s*%.*$/i,"")
    .replace(/\s+/g," ")
    .trim();

  return s;
}

/* =========================================================
   MERGE OCR PASSES
========================================================= */

function mergeSchemeBlocks(blockLists){
  const merged=[];

  for(const list of blockLists){
    for(const item of list){
      const name=cleanSchemeName(item.name);

      if(!name) continue;

      const found=merged.find(x=>{
        const a=norm(x.name);
        const b=norm(name);

        return a===b ||
          a.includes(b) ||
          b.includes(a);
      });

      if(found){
        found.rate=Math.max(found.rate,item.rate);

        found.rates=[
          ...new Set([
            ...found.rates,
            ...item.rates
          ])
        ].sort((a,b)=>a-b);

        if(found.mrp===null && item.mrp!==null){
          found.mrp=item.mrp;
        }

        if(name.length>found.name.length){
          found.name=name;
        }
      }else{
        merged.push({
          name,
          rate:item.rate,
          rates:item.rates,
          mrp:item.mrp
        });
      }
    }
  }

  /*
    Remove obvious false positives.
  */
  return merged.filter(x=>{
    const n=norm(x.name);

    if(
      n.includes("from") &&
      n.includes("to")
    ) return false;

    if(
      n.includes("proposal") ||
      n.includes("liability") ||
      n==="scheme"
    ) return false;

    return x.rate>0 && x.rate<=100;
  });
}

/* =========================================================
   READ SCHEME IMAGE
========================================================= */

async function detectSchemes(file){
  const img=await loadImage(file);

  const canvas1=makeCanvas(img,"normal");
  const canvas2=makeCanvas(img,"threshold");

  const worker=await Tesseract.createWorker("eng");

  try{
    await worker.setParameters({
      tessedit_pageseg_mode:"6",
      preserve_interword_spaces:"1"
    });

    setStatus("Reading scheme chart…");
    setProgress(15);

    const pass1=await runOCR(canvas1,worker);

    setProgress(40);

    await worker.setParameters({
      tessedit_pageseg_mode:"11",
      preserve_interword_spaces:"1"
    });

    const pass2=await runOCR(canvas2,worker);

    setProgress(60);

    const rows1=makeRows(pass1.words);
    const rows2=makeRows(pass2.words);

    const blocks1=buildSchemeBlocks(rows1);
    const blocks2=buildSchemeBlocks(rows2);

    const schemes=mergeSchemeBlocks([
      blocks1,
      blocks2
    ]);

    setProgress(70);

    await worker.terminate();

    return {
      schemes,
      rawText:
        pass1.text+"\n"+pass2.text
    };

  }catch(e){
    try{await worker.terminate()}catch(_){}
    throw e;
  }
}

/* =========================================================
   EXCEL READING
========================================================= */

async function readExcel(file){
  const buffer=await file.arrayBuffer();

  const wb=XLSX.read(buffer,{
    type:"array",
    cellDates:true
  });

  let bestRows=[];
  let bestHeader=-1;

  for(const sheetName of wb.SheetNames){
    const ws=wb.Sheets[sheetName];

    const rows=XLSX.utils.sheet_to_json(ws,{
      header:1,
      defval:""
    });

    for(let i=0;i<Math.min(rows.length,30);i++){
      const row=rows[i].map(v=>String(v||"").trim());

      const normalized=row.map(x=>norm(x));

      const hasDate=normalized.some(x=>
        x.includes("grn date")
      );

      const hasProduct=normalized.some(x=>
        x.includes("product name")
      );

      const hasGross=normalized.some(x=>
        x.includes("gross amount")
      );

      if(
        hasDate &&
        hasProduct &&
        hasGross
      ){
        bestRows=rows;
        bestHeader=i;
        break;
      }
    }

    if(bestHeader>=0) break;
  }

  if(bestHeader<0){
    throw new Error(
      "Could not find GRN Date, Product Name and Gross Amount columns."
    );
  }

  const headers=bestRows[bestHeader].map(v=>
    norm(v)
  );

  function findHeader(name){
    return headers.findIndex(x=>
      x===name ||
      x.includes(name)
    );
  }

  const productCol=findHeader("product name");
  const grossCol=findHeader("gross amount");
  const dateCol=findHeader("grn date");

  if(
    productCol<0 ||
    grossCol<0 ||
    dateCol<0
  ){
    throw new Error("Required purchase columns are missing.");
  }

  const rows=[];

  for(let i=bestHeader+1;i<bestRows.length;i++){
    const r=bestRows[i];

    const product=cleanText(r[productCol]);

    if(!product) continue;

    const gross=numberFromText(r[grossCol]);

    /*
      IMPORTANT:
      Quantity, cases, boxes, strips and pieces are never
      used in the calculation.
    */

    rows.push({
      product,
      productNorm:norm(product),
      gross
    });
  }

  return rows;
}

/* =========================================================
   PRODUCT MATCHING
========================================================= */

function hasMRP(product){
  const m=product.match(
    /(?:mrp|m\.r\.p)\s*[-.:]?\s*(\d+(?:\.\d+)?)/i
  );

  if(!m) return null;

  return normalizeMRP(m[1]);
}

function mrpMatches(schemeMRP,product){
  if(schemeMRP===null) return true;

  const pmrp=hasMRP(product);

  if(pmrp===null) return false;

  return Math.abs(pmrp-schemeMRP)<0.01;
}

/* =========================================================
   CONFY CATEGORY LOGIC
========================================================= */

function isMelody(product){
  return /\bmelody\b/i.test(product);
}

function isJar(product){
  return /\bjar\b/i.test(product);
}

function isPB(product){
  const p=norm(product);

  return (
    /\bpb\b/.test(p) ||
    /\bpbg\b/.test(p) ||
    /\bpoppins\b/.test(p) ||
    /\broll\b/.test(p)
  );
}

function isConfyFamily(product){
  const p=norm(product);

  return (
    p.includes("confy") ||
    isPB(product)
  );
}

/*
  This is the important permanent fix.

  Confy Excluding JAR & Melody:
  PB + PBG + POPPINS + ROLL/ROL are included.

  JAR scheme:
  JAR products are included, except Melody.
*/
function matchesConfyScheme(scheme,product){
  const s=norm(scheme.name);
  const p=norm(product);

  if(!s.includes("confy")) return null;

  const jarScheme=
    s.includes("jar");

  const nonJarScheme=
    s.includes("excluding jar") ||
    s.includes("excluding jar & melody") ||
    s.includes("excluding jar and melody");

  if(jarScheme){
    if(isMelody(product)) return false;
    return isJar(product);
  }

  if(nonJarScheme){
    if(isMelody(product)) return false;
    if(isJar(product)) return false;

    /*
      Explicitly include:
      PB
      PBG
      POPPINS
      ROLL
      ROL

      Plus normal non-JAR Confy family products.
    */
    return isConfyFamily(product);
  }

  return null;
}

/* =========================================================
   GENERIC PRODUCT MATCHING
========================================================= */

function tokenise(s){
  return norm(s)
    .replace(/[^a-z0-9]+/g," ")
    .split(/\s+/)
    .filter(Boolean);
}

const STOP=[
  "regular",
  "extra",
  "mrp",
  "rs",
  "inr",
  "pkt",
  "bag",
  "bags",
  "gm",
  "kg",
  "gram",
  "grams",
  "excluding",
  "exclude",
  "and",
  "the",
  "on",
  "scheme",
  "liability",
  "jar",
  "melody"
];

function productTokensForScheme(name){
  return tokenise(name)
    .filter(t=>
      !STOP.includes(t) &&
      !/^\d+(?:\.\d+)?$/.test(t)
    );
}

function genericMatch(scheme,product){
  const s=norm(scheme.name);
  const p=norm(product);

  /*
    Confy requires special category treatment.
  */
  const confy=matchesConfyScheme(scheme,product);

  if(confy!==null){
    return confy;
  }

  /*
    Exact MRP requirement whenever chart specifies MRP.
  */
  if(!mrpMatches(scheme.mrp,product)){
    return false;
  }

  const st=productTokensForScheme(scheme.name);

  if(!st.length) return false;

  /*
    Special combined 20-20 Butter & Cashew:
    product can be either Butter or Cashew.
  */
  if(
    s.includes("20-20") &&
    (s.includes("butter") || s.includes("cashew"))
  ){
    if(!p.includes("20-20")) return false;

    return (
      p.includes("butter") ||
      p.includes("cashew")
    );
  }

  /*
    For multiword names, require the meaningful product
    identity tokens. This prevents unrelated products from
    being counted.
  */
  let matches=0;

  for(const t of st){
    if(p.includes(t)){
      matches++;
    }
  }

  if(st.length===1){
    return matches===1;
  }

  /*
    Product names may contain extra descriptors, so accept
    when most identity words match.
  */
  return matches>=Math.max(
    1,
    Math.ceil(st.length*0.65)
  );
}

/* =========================================================
   CALCULATE SCHEME AMOUNTS
========================================================= */

function grossForScheme(scheme,purchases){
  let total=0;
  let matchedProducts={};

  for(const row of purchases){
    if(genericMatch(scheme,row.product)){
      total+=row.gross;

      matchedProducts[row.product]=
        (matchedProducts[row.product]||0)+row.gross;
    }
  }

  return {
    total,
    matchedProducts
  };
}

function calculateClaim(scheme,p1,p2){
  const a=grossForScheme(scheme,p1);
  const b=grossForScheme(scheme,p2);

  /*
    Gate:
    [(Month 1 Gross + Month 2 Gross) / 2] x 1.05
  */
  const average=(a.total+b.total)/2;
  const gate=average*1.05;

  /*
    Highest liability percentage only.
    Lower slabs are ignored.
  */
  const claim=gate*(scheme.rate/100);

  return {
    month1:a.total,
    month2:b.total,
    average,
    gate,
    rate:scheme.rate,
    claim,
    products1:a.matchedProducts,
    products2:b.matchedProducts
  };
}

/* =========================================================
   REVIEW SCREEN
========================================================= */

let detectedSchemes=[];
let purchase1=[];
let purchase2=[];

function renderReview(schemes){
  let html="";

  if(!schemes.length){
    html=`
      <div class="status error">
        No reliable scheme blocks were detected from the image.
        Please use a clear full chart image.
      </div>
    `;

    $("continueBtn").disabled=true;
    $("schemeTable").innerHTML=html;
    $("reviewCard").classList.remove("hidden");
    return;
  }

  html+=`
    <div style="overflow-x:auto">
    <table>
      <thead>
        <tr>
          <th>Scheme</th>
          <th>Highest Liability</th>
          <th>MRP</th>
          <th>Detected Slabs</th>
        </tr>
      </thead>
      <tbody>
  `;

  for(const s of schemes){
    html+=`
      <tr>
        <td>
          <div class="scheme-name">${escapeHTML(s.name)}</div>
        </td>
        <td>
          <span class="badge good">
            ${s.rate}%
          </span>
        </td>
        <td>
          ${s.mrp===null ? "All MRPs" : "Rs. "+s.mrp.toFixed(2)}
        </td>
        <td>
          ${s.rates.map(x=>x+"%").join(", ")}
        </td>
      </tr>
    `;
  }

  html+=`
      </tbody>
    </table>
    </div>
    <div class="small" style="margin-top:12px">
      Only the highest percentage in each scheme is used.
      Lower percentages are ignored.
    </div>
  `;

  $("schemeTable").innerHTML=html;
  $("continueBtn").disabled=false;
  $("reviewCard").classList.remove("hidden");
}

function escapeHTML(s){
  return String(s||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* =========================================================
   RESULT
========================================================= */

function renderResult(schemes){
  let grandTotal=0;
  let html="";

  html+=`
    <div style="overflow-x:auto">
    <table>
      <thead>
        <tr>
          <th>Scheme</th>
          <th>Month 1 Gross</th>
          <th>Month 2 Gross</th>
          <th>Gate</th>
          <th>Liability</th>
          <th>Claim</th>
        </tr>
      </thead>
      <tbody>
  `;

  for(const s of schemes){
    const r=calculateClaim(
      s,
      purchase1,
      purchase2
    );

    grandTotal+=r.claim;

    html+=`
      <tr>
        <td>
          <div class="scheme-name">
            ${escapeHTML(s.name)}
          </div>
        </td>
        <td class="amount">${money(r.month1)}</td>
        <td class="amount">${money(r.month2)}</td>
        <td class="amount">${money(r.gate)}</td>
        <td>${r.rate}%</td>
        <td class="amount">
          <strong>${money(r.claim)}</strong>
        </td>
      </tr>
    `;
  }

  html+=`
      </tbody>
    </table>
    </div>

    <div class="card" style="margin:16px 0 0;padding:16px;background:#f8f9fa">
      <div class="small">FINAL LIABILITY</div>
      <div class="total">${money(grandTotal)}</div>
    </div>
  `;

  /*
    Product matching detail.
    This is deliberately kept below the main report so the
    report stays clean but matching can still be verified.
  */
  html+=`
    <details style="margin-top:16px">
      <summary><strong>Product Matching Details</strong></summary>
      <div style="margin-top:12px">
  `;

  for(const s of schemes){
    const r=calculateClaim(
      s,
      purchase1,
      purchase2
    );

    const products=[
      ...new Set([
        ...Object.keys(r.products1),
        ...Object.keys(r.products2)
      ])
    ];

    html+=`
      <div style="margin-bottom:18px">
        <strong>${escapeHTML(s.name)}</strong>
        <div class="small">
          Highest liability used: ${s.rate}%
        </div>
    `;

    if(!products.length){
      html+=`
        <div class="status warn">
          No matching purchase SKU found in the two months.
        </div>
      `;
    }else{
      html+=`
        <div style="overflow-x:auto;margin-top:7px">
        <table>
          <thead>
            <tr>
              <th>Product / SKU</th>
              <th>Month 1</th>
              <th>Month 2</th>
            </tr>
          </thead>
          <tbody>
      `;

      for(const product of products){
        html+=`
          <tr>
            <td>${escapeHTML(product)}</td>
            <td class="amount">
              ${money(r.products1[product]||0)}
            </td>
            <td class="amount">
              ${money(r.products2[product]||0)}
            </td>
          </tr>
        `;
      }

      html+=`
          </tbody>
        </table>
        </div>
      `;
    }

    html+=`</div>`;
  }

  html+=`
      </div>
    </details>
  `;

  $("result").innerHTML=html;
  $("resultCard").classList.remove("hidden");
}

/* =========================================================
   MAIN CALCULATION
========================================================= */

$("calculateBtn").addEventListener("click",async()=>{
  const imageFile=$("schemeImage").files[0];
  const file1=$("month1").files[0];
  const file2=$("month2").files[0];

  $("reviewCard").classList.add("hidden");
  $("resultCard").classList.add("hidden");

  if(!imageFile){
    setStatus(
      "Please upload the current month's scheme chart image.",
      "error"
    );
    return;
  }

  if(!file1 || !file2){
    setStatus(
      "Please upload both previous complete months' purchase Excel files.",
      "error"
    );
    return;
  }

  $("calculateBtn").disabled=true;

  try{
    setStatus("Reading purchase files…");
    setProgress(5);

    purchase1=await readExcel(file1);

    setProgress(10);

    purchase2=await readExcel(file2);

    setProgress(12);

    if(!purchase1.length || !purchase2.length){
      throw new Error(
        "No purchase rows were found in one of the Excel files."
      );
    }

    const detected=await detectSchemes(imageFile);

    detectedSchemes=detected.schemes;

    /*
      Do not silently create a partial claim.
      A chart should contain several scheme blocks. If OCR
      detects only one or two, show the review instead of
      producing a misleading final amount.
    */
    if(detectedSchemes.length<3){
      renderReview(detectedSchemes);

      setStatus(
        "The image was read, but too few scheme blocks were detected. No claim was generated.",
        "error"
      );

      return;
    }

    /*
      If OCR has duplicate/conflicting blocks, mergeSchemeBlocks
      has already combined them and highest percentage wins.
    */
    renderReview(detectedSchemes);

    setStatus(
      detectedSchemes.length+
      " scheme blocks detected. Review the highest liability percentages.",
      "good"
    );

    setProgress(100);

  }catch(err){
    console.error(err);

    setStatus(
      err.message ||
      "Unable to calculate the claim.",
      "error"
    );

  }finally{
    $("calculateBtn").disabled=false;
  }
});

/* =========================================================
   CONTINUE
========================================================= */

$("continueBtn").addEventListener("click",()=>{
  if(!detectedSchemes.length) return;

  renderResult(detectedSchemes);

  $("resultCard").scrollIntoView({
    behavior:"smooth",
    block:"start"
  });
});
</script>

</body>
</html>
