<body>
<main>

<div class="card">
  <h1>Scheme Claim Report</h1>
  <div class="muted">
    Automatic purchase Excel + monthly scheme image
  </div>
</div>

<div class="card">

  <label>1. Purchase Excel</label>
  <input id="excel" type="file" accept=".xlsx,.xls,.csv">

  <label>2. Current Month Scheme Chart Image</label>
  <input id="chart" type="file" accept="image/*">

  <button id="go">Read Chart & Generate Report</button>

  <div id="status" class="status">
    Ready. Upload the purchase Excel and current month's scheme image.
  </div>

</div>

<div id="review" class="card hidden"></div>
<div id="result" class="card hidden"></div>

</main>

<script>

const $ = id => document.getElementById(id);

const status = $("status");

const money = n =>
  "Rs. " + Number(n || 0).toLocaleString("en-IN",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });

function clean(s){
  return String(s ?? "")
    .toLowerCase()
    .replace(/[₹]/g," rs ")
    .replace(/[^a-z0-9.%+\- ]/g," ")
    .replace(/\s+/g," ")
    .trim();
}

function numberValue(v){
  if(typeof v === "number") return isFinite(v) ? v : 0;

  let s=String(v ?? "")
    .replace(/[₹,\s]/g,"")
    .replace(/rs/ig,"");

  let n=parseFloat(s);

  return isNaN(n) ? 0 : n;
}

function excelDate(v){

  if(v instanceof Date && !isNaN(v))
    return v;

  if(typeof v === "number"){
    let d=new Date(Date.UTC(1899,11,30));
    d.setUTCDate(d.getUTCDate()+v);
    return d;
  }

  let d=new Date(v);

  return isNaN(d) ? null : d;
}

function monthKey(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}


/* =========================================================
   EXCEL
========================================================= */

function readPurchaseExcel(buffer){

  const wb=XLSX.read(buffer,{
    type:"array",
    cellDates:true
  });

  const ws=wb.Sheets[wb.SheetNames[0]];

  const rows=XLSX.utils.sheet_to_json(ws,{
    header:1,
    defval:""
  });

  /*
    The Parle purchase file can have title/blank rows
    before the real header.

    Find the actual row containing:
    GRN Date
    Product Name
    Gross Amount
  */

  let headerIndex=-1;

  for(let i=0;i<rows.length;i++){

    const r=rows[i].map(x =>
      String(x).trim().toLowerCase()
    );

    const hasDate=r.some(x=>x==="grn date");
    const hasName=r.some(x=>x==="product name");
    const hasGross=r.some(x=>x==="gross amount");

    if(hasDate && hasName && hasGross){
      headerIndex=i;
      break;
    }
  }

  if(headerIndex<0){
    throw new Error(
      "Could not find GRN Date, Product Name and Gross Amount columns."
    );
  }

  const header=rows[headerIndex].map(x =>
    String(x).trim().toLowerCase()
  );

  const dateIndex=header.indexOf("grn date");
  const nameIndex=header.indexOf("product name");
  const grossIndex=header.indexOf("gross amount");

  const data=[];

  for(let i=headerIndex+1;i<rows.length;i++){

    const r=rows[i];

    const date=excelDate(r[dateIndex]);
    const name=String(r[nameIndex] ?? "").trim();
    const gross=numberValue(r[grossIndex]);

    if(!date || !name) continue;

    data.push({
      date,
      name,
      gross
    });
  }

  if(!data.length)
    throw new Error("No valid purchase rows found.");

  return data;
}


/* =========================================================
   IMAGE PREPARATION
========================================================= */

function makeOCRImages(file){

  return new Promise((resolve,reject)=>{

    const img=new Image();

    img.onload=()=>{

      /*
        Upscale the image.
        Monthly charts are often small on WhatsApp/iPhone.
      */

      const scale=3;

      const canvas=document.createElement("canvas");

      canvas.width=img.width*scale;
      canvas.height=img.height*scale;

      const ctx=canvas.getContext("2d");

      ctx.drawImage(
        img,
        0,
        0,
        canvas.width,
        canvas.height
      );

      /*
        Create a normal image plus a grayscale/high-contrast
        image. OCR gets two opportunities.
      */

      const original=canvas.toDataURL("image/png");

      const imageData=ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );

      const d=imageData.data;

      for(let i=0;i<d.length;i+=4){

        const gray=
          0.299*d[i]+
          0.587*d[i+1]+
          0.114*d[i+2];

        /*
          Keep strong black text and white background.
        */

        const value=gray>175 ? 255 : 0;

        d[i]=value;
        d[i+1]=value;
        d[i+2]=value;
      }

      ctx.putImageData(imageData,0,0);

      const contrast=canvas.toDataURL("image/png");

      URL.revokeObjectURL(img.src);

      resolve([original,contrast]);
    };

    img.onerror=()=>{
      reject(new Error("Could not read the scheme chart image."));
    };

    img.src=URL.createObjectURL(file);

  });

}


/* =========================================================
   OCR
========================================================= */

async function runOCR(image){

  const result=await Tesseract.recognize(
    image,
    "eng",
    {
      logger:m=>{

        if(m.status==="recognizing text"){
          status.textContent=
            "Reading scheme chart... "+
            Math.round((m.progress||0)*100)+"%";
        }
      }
    }
  );

  return result.data;
}


/*
  We use OCR word coordinates.

  This is much better for a table than simply reading the entire
  image as one paragraph.
*/

function buildRows(data){

  const words=(data.words||[])
    .filter(w =>
      w.text &&
      w.confidence >= 20
    )
    .map(w=>({
      text:String(w.text).trim(),
      x:w.bbox.x0,
      y:w.bbox.y0,
      x2:w.bbox.x1,
      y2:w.bbox.y1,
      cy:(w.bbox.y0+w.bbox.y1)/2,
      confidence:w.confidence
    }));

  words.sort((a,b)=>a.cy-b.cy);

  const rows=[];

  for(const word of words){

    let row=null;

    /*
      Words on the same visual line normally have very similar
      vertical centres.
    */

    for(const r of rows){

      if(Math.abs(r.cy-word.cy)<=18){
        row=r;
        break;
      }
    }

    if(!row){

      row={
        cy:word.cy,
        words:[word]
      };

      rows.push(row);

    }else{

      row.words.push(word);

      row.cy=
        row.words.reduce((s,w)=>s+w.cy,0)/
        row.words.length;
    }
  }

  return rows
    .map(r=>{

      r.words.sort((a,b)=>a.x-b.x);

      return {
        text:r.words.map(w=>w.text).join(" "),
        words:r.words
      };

    })
    .sort((a,b)=>a.words[0].y-b.words[0].y);
}


/* =========================================================
   RATE EXTRACTION
========================================================= */

function percentages(text){

  const fixed=text
    .replace(/％/g,"%")
    .replace(/O(?=\s*%)/gi,"0");

  const arr=[...fixed.matchAll(
    /(\d+(?:\.\d+)?)\s*%/g
  )];

  return arr
    .map(m=>parseFloat(m[1]))
    .filter(x=>x>=0 && x<=100);
}


/*
  IMPORTANT:

  We deliberately use Math.max().

  LOWER SLABS ARE NEVER USED.

  Example:
  3.5%, 4%  -> 4%
  7%, 7.5%, 8% -> 8%
*/

function highestRate(text){

  const rates=percentages(text);

  if(!rates.length) return null;

  return Math.max(...rates);
}


/* =========================================================
   PRODUCT NAME CLEANING / MATCHING
========================================================= */

function tokens(s){

  return clean(s)
    .split(" ")
    .filter(x =>
      x.length>=2 &&
      ![
        "the","and","for","with","extra",
        "regular","pkt","gm","bag","mrp"
      ].includes(x)
    );
}

function similarity(chartName,excelName){

  const a=tokens(chartName);
  const b=tokens(excelName);

  if(!a.length) return 0;

  let hit=0;

  for(const x of a){

    if(b.includes(x))
      hit++;

  }

  return hit/a.length;
}


/*
  Extract possible MRP from a chart line.
*/

function chartMRP(text){

  const s=text.replace(/,/g,"");

  let m=s.match(
    /(?:mrp|m\.r\.p|rs|₹)\s*[-:]?\s*(\d+(?:\.\d+)?)/i
  );

  if(m) return parseFloat(m[1]);

  return null;
}


/*
  Extract the main product text before the first percentage.
*/

function productPart(text){

  const p=text.search(/\d+(?:\.\d+)?\s*%/);

  if(p>=0)
    return text.slice(0,p).trim();

  return text.trim();
}


/* =========================================================
   SCHEME DETECTION
========================================================= */

function detectSchemes(ocrRows){

  const schemes=[];

  for(const row of ocrRows){

    const rate=highestRate(row.text);

    if(rate===null) continue;

    const product=productPart(row.text);

    /*
      Ignore obvious headers / totals.
    */

    const low=clean(product);

    if(
      !low ||
      low==="product" ||
      low.includes("total") ||
      low.includes("scheme") ||
      low.includes("liability") ||
      low.includes("quantity")
    ) continue;

    schemes.push({
      name:product,
      rate,
      mrp:chartMRP(row.text),
      source:row.text
    });
  }

  /*
    Remove duplicate OCR lines.
  */

  const unique=[];

  for(const s of schemes){

    const exists=unique.some(u =>
      clean(u.name)===clean(s.name)
    );

    if(!exists)
      unique.push(s);
  }

  return unique;
}


/* =========================================================
   CURRENT CHART REVIEW
========================================================= */

function renderReview(schemes){

  const box=$("review");

  box.classList.remove("hidden");

  let html="";

  html+=
    "<h2>Highest Slab Detected From Current Chart</h2>";

  html+=
    "<div class='ok'><b>Rule locked:</b> only the highest liability % is used for each scheme. All lower slabs are ignored.</div>";

  if(!schemes.length){

    html+=
      "<div class='warn'><b>No reliable scheme rows were detected.</b><br><br>"+
      "Do not continue. The chart image needs to be clearer.</div>";

    box.innerHTML=html;
    return;
  }

  schemes.forEach((s,i)=>{

    html+=`
      <div class="rule">

        <div class="small">Scheme detected from image</div>

        <input
          id="scheme_${i}"
          value="${escapeHTML(s.name)}"
        >

        <div class="small" style="margin-top:9px">
          Highest liability %
        </div>

        <input
          id="rate_${i}"
          type="number"
          step="0.1"
          value="${s.rate}"
        >

        <div class="small" style="margin-top:9px">
          MRP detected (leave blank if chart has no MRP)
        </div>

        <input
          id="mrp_${i}"
          type="number"
          step="0.01"
          value="${s.mrp===null ? "" : s.mrp}"
        >

        <div class="small" style="margin-top:9px">
          OCR source: ${escapeHTML(s.source)}
        </div>

      </div>
    `;
  });

  html+=`
    <button id="calculate" class="green">
      Confirm Highest Slabs & Calculate
    </button>
  `;

  box.innerHTML=html;

  $("calculate").onclick=()=>{

    const finalSchemes=[];

    schemes.forEach((s,i)=>{

      const name=$("scheme_"+i).value.trim();

      const rate=parseFloat(
        $("rate_"+i).value
      );

      const mrpValue=$("mrp_"+i).value.trim();

      const mrp=
        mrpValue==="" ?
        null :
        parseFloat(mrpValue);

      if(name && isFinite(rate) && rate>0){

        finalSchemes.push({
          name,
          rate:rate/100,
          mrp:isFinite(mrp) ? mrp : null,
          source:s.source
        });
      }

    });

    if(!finalSchemes.length){

      alert("No valid scheme rules.");
      return;
    }

    calculateReport(finalSchemes);
  };
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(s){

  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================================================
   PRODUCT SELECTION
========================================================= */

function selectProducts(rows,scheme){

  const schemeName=clean(scheme.name);

  /*
    Exact MRP requirement when the chart specifies MRP.
  */

  const mrpRequired=scheme.mrp;

  /*
    Convert product name into tokens.
  */

  const words=tokens(scheme.name);

  /*
    Some OCR lines contain quantity/slab information.
    Remove generic chart words.
  */

  const useful=words.filter(x =>
    ![
      "from","to","upto","above",
      "minimum","maximum",
      "liability","scheme",
      "excluding","exclude"
    ].includes(x)
  );

  let selected=[];

  for(const r of rows){

    const n=clean(r.name);

    /*
      If chart specifies MRP, exact MRP must appear
      in the Excel product name.
    */

    if(mrpRequired!==null){

      const mrpText=String(mrpRequired)
        .replace(/\.0+$/,"");

      const escaped=mrpText.replace(".","\\.");

      if(!new RegExp(
        "(?:mrp|-)\\s*"+escaped+
        "(?:\\b|$)",
        "i"
      ).test(n)){

        continue;
      }
    }

    /*
      Explicit exclusions from the CURRENT chart.
    */

    if(
      schemeName.includes("excluding") &&
      schemeName.includes("melody") &&
      n.includes("melody")
    ) continue;

    if(
      schemeName.includes("jar") &&
      schemeName.includes("excluding") &&
      n.includes("melody")
    ) continue;

    /*
      JAR scheme should contain jar.
    */

    if(
      schemeName.includes("jar") &&
      !schemeName.includes("excluding jar") &&
      !/\bjar\b/.test(n)
    ){
      /*
        Do not reject if OCR says "confy jars".
      */
      if(!schemeName.includes("jars"))
        continue;
    }

    /*
      If the chart says excluding JAR,
      remove JAR products.
    */

    if(
      schemeName.includes("excluding jar") &&
      /\bjar\b/.test(n)
    ) continue;

    /*
      Try token matching.
    */

    let hit=0;

    for(const w of useful){

      if(n.includes(w))
        hit++;
    }

    /*
      Special generic category interpretation.

      This is NOT a hardcoded monthly rate/product list.
      It only interprets common category words appearing
      in the CURRENT chart.
    */

    if(
      schemeName.includes("confy") &&
      !schemeName.includes("jar")
    ){

      /*
        "Confy excluding JAR & Melody"
        means Confy non-JAR, non-Melody products.
      */

      if(/\bjar\b/.test(n)) continue;
      if(n.includes("melody")) continue;

      if(
        n.includes("confy") ||
        n.includes("pb") ||
        n.includes("pbg") ||
        n.includes("poppins") ||
        n.includes("roll") ||
        n.includes("rol")
      ){
        selected.push(r);
        continue;
      }
    }

    if(
      schemeName.includes("confy") &&
      (
        schemeName.includes("jar") ||
        schemeName.includes("jars")
      )
    ){

      if(/\bjar\b/.test(n) && !n.includes("melody"))
        selected.push(r);

      continue;
    }

    /*
      Normal product matching.
    */

    if(useful.length && hit/useful.length>=0.45){

      selected.push(r);
    }
  }

  return selected;
}


/* =========================================================
   CALCULATION
========================================================= */

function calculateReport(schemes){

  try{

    status.textContent="Calculating...";

    const excelFile=$("excel").files[0];

    excelFile.arrayBuffer().then(buffer=>{

      const rows=readPurchaseExcel(buffer);

      const monthTotals={};

      rows.forEach(r=>{

        const m=monthKey(r.date);

        monthTotals[m]=
          (monthTotals[m]||0)+r.gross;

      });

      const months=Object.keys(monthTotals).sort();

      if(months.length<2){

        throw new Error(
          "At least two complete purchase months are required."
        );
      }

      /*
        Full previous two complete months.
      */

      const m1=months[months.length-2];
      const m2=months[months.length-1];

      const output=[];

      for(const scheme of schemes){

        const selected=selectProducts(rows,scheme);

        const a=selected
          .filter(r=>monthKey(r.date)===m1)
          .reduce((s,r)=>s+r.gross,0);

        const b=selected
          .filter(r=>monthKey(r.date)===m2)
          .reduce((s,r)=>s+r.gross,0);

        const average=(a+b)/2;

        /*
          Gate = average + 5%
        */

        const gate=average*1.05;

        /*
          HIGHEST SLAB ONLY.

          The chart-review step already selected the
          maximum percentage. No lower slab is used.
        */

        const claim=gate*scheme.rate;

        output.push({
          scheme:scheme.name,
          rate:scheme.rate,
          mrp:scheme.mrp,
          a,
          b,
          average,
          gate,
          claim,
          skus:[...new Set(
            selected.map(x=>x.name)
          )]
        });
      }

      const total=output.reduce(
        (s,r)=>s+r.claim,
        0
      );

      renderResult({
        m1,
        m2,
        output,
        total
      });

    }).catch(e=>{

      status.textContent="Error: "+e.message;

    });

  }catch(e){

    status.textContent="Error: "+e.message;
  }
}


/* =========================================================
   RESULT
========================================================= */

function renderResult(calc){

  const box=$("result");

  box.classList.remove("hidden");

  let html="";

  html+=
    "<h2>Scheme Claim Report</h2>";

  html+=
    "<p><b>Previous complete months:</b> "+
    calc.m1+
    " and "+
    calc.m2+
    "</p>";

  html+=`
    <div class="ok">
      <b>Highest slab rule applied:</b>
      Only the highest liability percentage detected
      for each current-month scheme has been used.
      Lower slabs are ignored.
    </div>
  `;

  html+=`
    <div class="scroll">
    <table>
      <tr>
        <th>Scheme</th>
        <th>Month 1</th>
        <th>Month 2</th>
        <th>Average</th>
        <th>Gate</th>
        <th>Highest Liability</th>
        <th>Claim</th>
      </tr>
  `;

  calc.output.forEach(r=>{

    html+=`
      <tr>
        <td>
          <b>${escapeHTML(r.scheme)}</b>
          ${
            r.mrp!==null
            ? "<br><span class='small'>MRP ₹"+r.mrp+"</span>"
            : ""
          }
        </td>

        <td>${money(r.a)}</td>
        <td>${money(r.b)}</td>
        <td>${money(r.average)}</td>
        <td>${money(r.gate)}</td>

        <td>
          <b>${(r.rate*100).toFixed(1)}%</b>
        </td>

        <td>
          <b>${money(r.claim)}</b>
        </td>
      </tr>
    `;
  });

  html+="</table></div>";

  html+=`
    <div class="total">
      FINAL LIABILITY: ${money(calc.total)}
    </div>
  `;

  html+=`
    <div class="warn">
      <b>Product matching:</b><br>
      ${calc.output.map(r=>
        "<b>"+escapeHTML(r.scheme)+"</b>: "+
        (r.skus.length
          ? r.skus.map(escapeHTML).join(", ")
          : "No matching purchase SKU found")
      ).join("<br><br>")}
    </div>
  `;

  html+=`
    <button id="pdf" class="green">
      Generate PDF Report
    </button>
  `;

  box.innerHTML=html;

  $("pdf").onclick=()=>{
    makePDF(calc);
  };

  status.textContent="Calculation complete.";
}


/* =========================================================
   PDF
========================================================= */

function makePDF(calc){

  const {jsPDF}=window.jspdf;

  const doc=new jsPDF({
    orientation:"landscape",
    unit:"mm",
    format:"a4"
  });

  doc.setFont("helvetica","bold");
  doc.setFontSize(17);

  doc.text(
    "SCHEME CLAIM REPORT",
    148,
    14,
    {align:"center"}
  );

  doc.setFont("helvetica","normal");
  doc.setFontSize(8);

  doc.text(
    "Gross Amount only | Full previous two months | Highest slab % only",
    148,
    20,
    {align:"center"}
  );

  doc.text(
    "Previous months: "+calc.m1+" and "+calc.m2,
    148,
    25,
    {align:"center"}
  );

  let y=34;

  const x=[
    8,62,91,120,150,184,218
  ];

  const headers=[
    "Scheme",
    "Month 1",
    "Month 2",
    "Average",
    "Gate",
    "Liability",
    "Claim"
  ];

  doc.setFont("helvetica","bold");
  doc.setFontSize(8);

  headers.forEach((h,i)=>{
    doc.text(h,x[i],y);
  });

  y+=6;

  doc.setFont("helvetica","normal");

  calc.output.forEach(r=>{

    if(y>190){

      doc.addPage();
      y=15;

    }

    const schemeText=
      r.scheme.length>30
      ? r.scheme.substring(0,30)
      : r.scheme;

    const values=[
      schemeText,
      money(r.a),
      money(r.b),
      money(r.average),
      money(r.gate),
      (r.rate*100).toFixed(1)+"%",
      money(r.claim)
    ];

    values.forEach((v,i)=>{

      doc.text(
        String(v),
        x[i],
        y
      );
    });

    y+=6;
  });

  y+=5;

  doc.setFont("helvetica","bold");
  doc.setFontSize(12);

  doc.text(
    "FINAL LIABILITY: "+money(calc.total),
    148,
    y,
    {align:"center"}
  );

  doc.save(
    "Scheme_Claim_Report.pdf"
  );
}


/* =========================================================
   MAIN BUTTON
========================================================= */

$("go").onclick=async()=>{

  try{

    const excel=$("excel").files[0];
    const chart=$("chart").files[0];

    if(!excel)
      throw new Error(
        "Please upload the purchase Excel."
      );

    if(!chart)
      throw new Error(
        "Please upload the current month's scheme chart image."
      );

    $("go").disabled=true;

    $("review").classList.add("hidden");
    $("result").classList.add("hidden");

    status.textContent="Reading purchase Excel...";

    /*
      Verify Excel immediately.
    */

    await excel.arrayBuffer()
      .then(buf=>readPurchaseExcel(buf));

    status.textContent=
      "Preparing scheme chart image...";

    const images=
      await makeOCRImages(chart);

    status.textContent=
      "Reading scheme chart...";

    /*
      OCR original image.
    */

    const ocr1=
      await runOCR(images[0]);

    /*
      OCR high-contrast image.
    */

    status.textContent=
      "Checking chart text...";

    const ocr2=
      await runOCR(images[1]);

    /*
      Build visual rows from both OCR passes.
    */

    const rows1=
      buildRows(ocr1);

    const rows2=
      buildRows(ocr2);

    const schemes1=
      detectSchemes(rows1);

    const schemes2=
      detectSchemes(rows2);

    /*
      Merge OCR results.
    */

    const all=[
      ...schemes1,
      ...schemes2
    ];

    const merged=[];

    for(const s of all){

      const existing=
        merged.find(x=>
          similarity(x.name,s.name)>=0.75 ||
          similarity(s.name,x.name)>=0.75
        );

      if(!existing){

        merged.push({...s});

      }else{

        /*
          Always keep the HIGHEST rate.
        */

        existing.rate=
          Math.max(
            existing.rate,
            s.rate
          );

        if(existing.mrp===null)
          existing.mrp=s.mrp;
      }
    }

    /*
      Sort highest-confidence-looking rows first.
    */

    merged.sort((a,b)=>
      b.rate-a.rate
    );

    renderReview(merged);

    status.textContent=
      "Chart read. Confirm the detected scheme names and highest slabs.";

    window.scrollTo({
      top:$("review").offsetTop-10,
      behavior:"smooth"
    });

  }catch(e){

    status.textContent=
      "Error: "+e.message;

  }finally{

    $("go").disabled=false;

  }
};

</script>
